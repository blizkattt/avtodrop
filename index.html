/* =====================================================================
   v7 — «Гоночная наклейка»: сплошные цвета, толстый контур, косые плашки
   ===================================================================== */
:root{--ink:#120a2b;--night:#1d1150;--card:#2b1b78;--card2:#22155f;--yel:#ffd21f;--pink:#ff2e7e;--blue:#2f7bff;--mint:#19df8b;--red:#ff4545;
 --display:"AD Display","Arial Black",system-ui,sans-serif;--body:"AD Body",system-ui,-apple-system,"Segoe UI",sans-serif;--skew:-9deg;--fg:#fff;--mute:#b9b0ea;--line:var(--ink)}
body{font-family:var(--body);font-weight:700;background:var(--night)}
h1,h2,h3,.glow,.cbox .cname,.num{font-family:var(--display);font-weight:900;font-style:italic;letter-spacing:-.01em}
.num{font-style:normal;font-family:var(--body);font-weight:800}
.mute{color:var(--mute)}
#bgv{background:linear-gradient(180deg,rgba(18,10,43,.15),rgba(18,10,43,.35) 45%,rgba(18,10,43,.2))}
/* верх */
.top{background:linear-gradient(var(--ink) 62%,rgba(18,10,43,0));padding:10px 12px 16px}
.burger{background:var(--blue);border:2.5px solid var(--ink);border-radius:13px;box-shadow:0 4px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.35)}
.burger i{background:#fff;height:3px}
.ava{background:conic-gradient(var(--yel) var(--p),rgba(255,255,255,.15) 0);box-shadow:0 0 0 2.5px var(--ink)}
.ava b{background:linear-gradient(160deg,#ff5fa2,#7b3dff);font-family:var(--display);font-style:italic}
.ava i{background:var(--yel);color:var(--ink);border:2.5px solid var(--ink);font-family:var(--display);font-style:italic}
.who b{font-family:var(--display);font-style:italic;font-size:14px}
.pill{background:var(--card);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.12);height:38px;font-family:var(--display);font-style:italic;font-size:14px;padding-left:3px}
.pill .cur{width:30px;height:30px;margin:-4px 0 -4px -6px;filter:none}
.pill .plus{background:var(--mint);border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);color:var(--ink)}
.luck{background:var(--mint);color:var(--ink);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-family:var(--display);font-style:italic}
/* заголовок экрана: косая полоса цвета раздела */
.shead{gap:10px;align-items:center}
.shead .ico.lg{width:52px;height:52px;border-radius:15px;border:2.5px solid var(--ink);box-shadow:0 4px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.45);transform:rotate(-6deg)}
.shead h2{display:inline-block;align-self:flex-start;font-size:25px;line-height:1;padding:6px 14px 8px 12px;background:var(--hc,#7b3dff);border:2.5px solid var(--ink);box-shadow:4px 4px 0 var(--ink);transform:skewX(var(--skew));border-radius:6px;margin-left:4px}
.shead h2>span{display:inline-block;transform:skewX(calc(var(--skew) * -1));text-shadow:0 2px 0 rgba(18,10,43,.55)}
.shead .ssb{font-size:12px;color:var(--mute);margin-top:4px;padding-left:6px}
/* кнопки: параллелограмм с контуром и твёрдой тенью */
.btn{--bg:linear-gradient(180deg,#5b9bff,#2f6bff 55%,#1f4fd6);--sh:var(--ink);position:relative;isolation:isolate;overflow:visible;background:none!important;border:0!important;box-shadow:none!important;color:#fff;font-family:var(--display);font-style:italic;font-weight:900;font-size:13.5px;letter-spacing:0;padding:12px 18px 13px;border-radius:0;text-shadow:0 2px 0 rgba(18,10,43,.45);transition:transform .08s}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--bg);border:2.5px solid var(--ink);border-radius:10px;transform:skewX(var(--skew));box-shadow:0 4px 0 var(--sh),inset 0 2px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.18)}
.btn:active:not(:disabled){transform:translateY(3px)}
.btn:active:not(:disabled)::before{box-shadow:0 1px 0 var(--sh),inset 0 2px 0 rgba(255,255,255,.4)}
.btn.pri{--bg:linear-gradient(180deg,#ffe866,#ffc400 55%,#ff9d00);color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.5)}
.btn.pri::after{display:none}
.btn.ok{--bg:linear-gradient(180deg,#6dffb9,#19df8b 55%,#0fb06b);color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.4)}
.btn.gold{--bg:linear-gradient(180deg,#fff2a6,#ffd21f 50%,#f2a600);color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.5)}
.btn.bad{--bg:linear-gradient(180deg,#ff8a8a,#ff4545 55%,#d81f3a);color:#fff}
.btn.sm{padding:8px 13px 9px;font-size:12px}
.btn.sm::before{border-radius:8px;box-shadow:0 3px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.4)}
.btn.big{padding:15px 20px 16px;font-size:16px}
.btn:disabled{filter:grayscale(.9) brightness(.75);opacity:.85}
.btn svg{stroke:currentColor}
.shine::after{content:"";position:absolute;inset:0;z-index:0;border-radius:10px;transform:skewX(var(--skew));background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.65) 50%,transparent 65%) no-repeat;background-size:300% 100%;animation:shine7 2.6s ease-in-out infinite;pointer-events:none;mix-blend-mode:soft-light;width:auto;top:0;bottom:0;left:0}
@keyframes shine7{0%,50%{background-position:120% 0}100%{background-position:-20% 0}}
/* карточки: сплошной цвет, контур, твёрдая тень */
.card,.item,.rank,.offer,.clrow,.clmem,.stats>div,.xprize>div{background:linear-gradient(180deg,var(--card),var(--card2));border:2.5px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.1)}
.item,.rank,.clrow,.clmem{border-radius:15px;box-shadow:0 4px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.1)}
.card h3,.item b{font-family:var(--display);font-style:italic}
.banner{background:#16a2ff;color:#fff;border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);font-weight:700;text-shadow:0 1px 0 rgba(18,10,43,.35)}
.bar{background:var(--ink);border:2px solid var(--ink);height:12px}
.bar>i{background:repeating-linear-gradient(-55deg,#ff5fa2 0 8px,#ff2e7e 8px 16px);box-shadow:none}
.bar.gold>i{background:repeating-linear-gradient(-55deg,#ffe866 0 8px,#ffc400 8px 16px)}
.tag{background:var(--ink);color:#fff;border-radius:7px;font-family:var(--display);font-style:italic}
.tag.taxi{background:var(--yel);color:var(--ink);border:2px solid var(--ink)}
.rb{border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);font-family:var(--display);font-style:italic;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.35)}
.dot{background:var(--red);border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);font-family:var(--display);font-style:italic}
.chip{background:var(--yel);color:var(--ink);border:2px solid var(--ink)}
.fchip{background:var(--pink);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);transform:skewX(var(--skew));border-radius:7px;font-family:var(--display);font-style:italic;letter-spacing:.02em;text-transform:none;font-size:11px}
select,input{background:var(--ink);border:2.5px solid var(--ink);border-radius:12px;box-shadow:inset 0 2px 6px rgba(0,0,0,.4);font-weight:800}
/* сегменты-вкладки */
.seg{background:var(--ink);border:2.5px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.seg button{font-family:var(--display);font-style:italic;color:var(--mute);border-radius:10px}
.seg button[aria-pressed="true"]{background:var(--yel);color:var(--ink);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 3px 0 #b07a00;transform:skewX(var(--skew))}
.seg button[aria-pressed="true"]>*{transform:skewX(calc(var(--skew) * -1))}
.seg.au3 .rtab[aria-pressed="true"]{background:var(--red);color:#fff}
/* нижнее меню */
nav.tabs{background:var(--ink)!important;border-top:0;border-radius:0;box-shadow:0 -6px 0 rgba(18,10,43,.6);padding-top:8px}
nav.tabs button{color:#9d92d8;font-family:var(--display);font-style:italic;font-size:10.5px}
nav.tabs .ni{border-radius:12px}
nav.tabs button[aria-current="true"]{color:#fff}
nav.tabs button[aria-current="true"] .ni{background:var(--yel);color:var(--ink);border:2.5px solid #000;box-shadow:0 3px 0 #000;transform:translateY(-6px) skewX(var(--skew))}
nav.tabs button[aria-current="true"] .ni svg{transform:skewX(calc(var(--skew) * -1))}
nav.tabs .mid .ni{background:var(--pink);border:3px solid #000;box-shadow:0 5px 0 #000,inset 0 3px 0 rgba(255,255,255,.4);transform:translateY(-22px) rotate(-6deg)}
nav.tabs .mid[aria-current="true"] .ni{background:var(--yel);transform:translateY(-24px) rotate(-6deg)}
nav.tabs .mid[aria-current="true"] .ni svg{transform:none}
@keyframes midpulse{50%{transform:translateY(-24px) rotate(6deg) scale(1.06)}}
.ndot{background:var(--red);border:2px solid var(--ink)}
/* меню «три полоски» */
.drawer{background:var(--night);border-right:3px solid var(--ink)}
.drawer .grp{font-family:var(--display);font-style:italic;text-transform:none;letter-spacing:0;font-size:14px;color:var(--yel)}
.drawer .mt{background:var(--card);border:2.5px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-family:var(--display);font-style:italic;font-size:11.5px}
.drawer .mt.on{background:#4a2bb0}
.drawer .swt{background:var(--card);border:2.5px solid var(--ink)}
.ico{border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.45)}
/* окна и уведомления */
.modal{background:rgba(18,10,43,.72)}
.sheet{background:var(--night);border:3px solid var(--ink);border-bottom:0;box-shadow:0 -6px 0 rgba(0,0,0,.25)}
.sheet .x{background:var(--red);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);color:#fff;font-weight:900}
.toast{background:var(--yel);color:var(--ink);border:2.5px solid var(--ink);box-shadow:0 5px 0 var(--ink);font-family:var(--display);font-style:italic;font-size:14px}
/* главная: баннер сезона */
.sban{border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);border-radius:24px}
.sname{font-size:38px;text-shadow:3px 3px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
.ssub{font-weight:700;text-shadow:0 1px 0 var(--ink)}
.sbp{border:2px solid var(--ink);height:10px}.sbp i{background:repeating-linear-gradient(-55deg,#ffe866 0 8px,#ffc400 8px 16px)}
.qt2{border:2.5px solid var(--ink);background:linear-gradient(180deg,color-mix(in srgb,var(--ic) 88%,#fff),var(--ic) 45%,color-mix(in srgb,var(--ic),#000 22%));box-shadow:0 5px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.45);border-radius:18px}
.qt2 .qi{background:rgba(18,10,43,.28);border:0;box-shadow:inset 0 2px 4px rgba(0,0,0,.25);border-radius:50%}
.qt2 .ql{font-family:var(--display);font-style:italic;font-size:11px;text-shadow:0 1px 0 rgba(18,10,43,.6)}
.qt2:active{box-shadow:0 2px 0 var(--ink)}
/* кейсы */
.cbox{border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.35);background:linear-gradient(180deg,color-mix(in srgb,var(--c1),#fff 8%) 0%,var(--c1) 40%,color-mix(in srgb,var(--c1),#120a2b 55%) 100%)}
.cbox:active{box-shadow:0 2px 0 var(--ink)}
.cbox .cname{font-size:16px;text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
.cbox .cprice{background:var(--yel);color:var(--ink);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);transform:skewX(var(--skew));border-radius:8px;font-family:var(--display);font-style:italic;font-size:14px}
.cbox .rays{opacity:.35}
.ctag{background:var(--ink)!important;color:var(--yel)!important;border:0;font-family:var(--display);font-style:italic}
.cfree{border:2px solid var(--ink)}
.fcase{--c1:#0c9e5f}
.fcase .mute{color:#d6ffe9}
.fcase .cprice{background:var(--ink);color:#bfffdc;box-shadow:none}
.fcase.ready .cprice{background:var(--mint);color:var(--ink)}
.chances{border:2px solid var(--ink);border-radius:6px;height:9px}
.pity{background:var(--ink)}
.grp-h h3{font-size:19px;text-shadow:2px 2px 0 var(--ink)}
.sec h3{font-family:var(--display);font-style:italic;font-size:17px;color:#fff;text-shadow:2px 2px 0 var(--ink)}
/* гараж и плитки машин */
.tile{background:radial-gradient(110% 70% at 50% 28%,color-mix(in srgb,var(--rc) 55%,transparent),transparent 72%),linear-gradient(180deg,var(--card),var(--card2));border:2.5px solid var(--ink);box-shadow:0 5px 0 var(--ink);border-radius:16px}
.tile::before{display:none}
.tile .nm{font-family:var(--display);font-style:italic;font-size:12px}
.tile .vl{font-family:var(--display);font-style:italic;color:var(--yel);font-size:13px}
.stats b{font-family:var(--display);font-style:italic;font-size:17px}
.taxiw .tw2 b{color:var(--yel);text-shadow:2px 2px 0 var(--ink);font-family:var(--display);font-style:italic}
.shw,.feat,.evb,.rcard,.expo-now,.clhead,.rareb,.bphead,.balcard,.show,.deal,.snew{border:3px solid var(--ink)!important;box-shadow:0 6px 0 var(--ink)!important}
.feat{background:linear-gradient(135deg,var(--c1),color-mix(in srgb,var(--c1),#120a2b 55%))}
.fname{font-size:24px;text-shadow:2px 2px 0 var(--ink)}
.empty{border:2.5px dashed #5b4bb5;background:rgba(18,10,43,.35)}
/* рейтинг, задания, пасс */
.rank .p{font-family:var(--display);font-style:italic;font-size:18px}
.rank:nth-child(1){background:linear-gradient(180deg,#ffd21f,#f2a600);color:var(--ink)}.rank:nth-child(1) .mute{color:#5a3a00}.rank:nth-child(1) .p{color:var(--ink)}
.bpc{border:2.5px solid var(--ink);box-shadow:0 4px 0 var(--ink);background:linear-gradient(180deg,var(--card),var(--card2))}
.bpc.prem{background:linear-gradient(180deg,#ffb84a,#e07b00 60%,#a54d00)}
.bpc.can{box-shadow:0 4px 0 var(--ink),0 0 0 3px var(--mint)}
.bplv b{border:2.5px solid var(--ink);font-family:var(--display);font-style:italic}
.ring b{font-family:var(--display);font-style:italic;border:2.5px solid var(--ink)}
.pack,.vtile,.xcard,.bpsell,.luckc,.paycard{border:2.5px solid var(--ink)!important;box-shadow:0 5px 0 var(--ink)!important}
.pamt{font-family:var(--display);font-style:italic;font-size:24px;text-shadow:2px 2px 0 var(--ink)}
.pprice{background:var(--blue);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);transform:skewX(var(--skew));border-radius:8px;font-family:var(--display);font-style:italic}
.ptag{background:var(--pink);border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);font-family:var(--display);font-style:italic}
.bigbal b{text-shadow:3px 3px 0 var(--ink)}
.coin{width:26px;height:26px;margin:-13px 0 0 -13px;background:none;box-shadow:none;border-radius:0}
.coin svg{width:100%;height:100%;display:block}
.plate{border:2px solid var(--ink)}
/* v7: яркие сплошные блоки вместо стекла */
.balcard{background:radial-gradient(90% 80% at 50% 0%,rgba(255,255,255,.25),transparent 60%),linear-gradient(160deg,#8a4dff,#4320c0)!important;border:3px solid var(--ink)!important;box-shadow:0 6px 0 var(--ink)!important}
.balcard .mute{color:#e6dcff}
.bphead,.snew{background:radial-gradient(90% 70% at 85% 0%,rgba(255,255,255,.28),transparent 55%),linear-gradient(160deg,var(--c1) 0%,color-mix(in srgb,var(--c1),var(--c2) 55%) 45%,var(--c2) 100%)!important}
.sban{background:radial-gradient(90% 70% at 85% 0%,rgba(255,255,255,.25),transparent 55%),linear-gradient(165deg,var(--c1) 0%,color-mix(in srgb,var(--c1),var(--c2) 60%) 40%,var(--c2) 100%)}
.bplvl{background:rgba(18,10,43,.55);border:2.5px solid var(--ink)}
.bpsell{background:linear-gradient(180deg,#ffd166,#ff9f1c)!important;color:var(--ink)}.bpsell .mute{color:#5a3200}.bpsell>svg{stroke:var(--ink)}
.luckc{background:linear-gradient(180deg,#6dffb9,#19c27a)!important;color:var(--ink)}.luckc .small{color:#06422a}.luckc>svg{stroke:var(--ink)}
.paycard{background:linear-gradient(180deg,#6dffb9,#19c27a)!important;color:var(--ink)}.paycard .mute{color:#06422a}.paycard b{font-family:var(--display);font-style:italic;color:var(--ink);font-size:16px}
.clhead{background:radial-gradient(90% 80% at 90% 0%,rgba(255,255,255,.25),transparent 60%),linear-gradient(160deg,#ff4d6d,#a3123a)!important}
.clhead.new{background:radial-gradient(90% 80% at 90% 0%,rgba(255,255,255,.25),transparent 60%),linear-gradient(160deg,#2f9bff,#1c3fb8)!important}
.expo-now{background:radial-gradient(90% 70% at 50% 0%,rgba(255,255,255,.22),transparent 60%),linear-gradient(170deg,#ff9f1c,#c2187a 55%,#5a1a8c)!important}
.rareb{background:radial-gradient(90% 80% at 90% 0%,rgba(255,255,255,.22),transparent 60%),linear-gradient(160deg,#ff5a3d,#a3123a)!important}
.shw{background:radial-gradient(80% 60% at 50% 35%,color-mix(in srgb,var(--rc) 55%,transparent),transparent 70%),linear-gradient(180deg,#2b1b78,#170e45)!important}
.bprow.hd b{font-family:var(--display);font-style:italic;font-size:13px}
.xjoin>b,.xmine b{font-family:var(--display);font-style:italic}
.deal{background:linear-gradient(135deg,#ff2e7e,#7b3dff)!important}
.cbox .mute,.cbox .ptxt{color:#fff;text-shadow:0 1px 0 var(--ink),0 0 3px rgba(18,10,43,.8)}
.bpc.lock{filter:saturate(.75) brightness(.8)}
.vtile .nm,.xcard .xn,.pod b{font-family:var(--display);font-style:italic}
.result .glow{text-shadow:3px 3px 0 var(--ink)}
/* производительность: лучи крутятся только в окнах выпадения, остальные статичны */
.rays{animation:none}
.reveal .rays,.lvup .rays,.snew .rays,.prestage .rays{animation:spin 16s linear infinite}
.float{filter:none}

/* =====================================================================
   v8 — «Аркада»: светлые карточки, конфетные кнопки с бликом, пружинящие нажатия
   ===================================================================== */
:root{--ink:#1a1347;--paper:#ffffff;--paper2:#ecebff;--txt:#1a1347;--txt2:#6a64a6;--sky1:#3d7bff;--sky2:#7a3dff;--yel:#ffcc00;--pink:#ff3d8b;--blue:#2f86ff;--mint:#1fd67a;--red:#ff4a4a;--org:#ff8a00}
h1,h2,h3,.glow,.cbox .cname{font-family:var(--display);font-style:normal;font-weight:900}
.btn,.pill,.who b,.ava b,.ava i,.fchip,.tag,.rb,.dot,.seg button,nav.tabs button,.drawer .grp,.drawer .mt,.ring b,.bplv b,.qt2 .ql,.tile .nm,.tile .vl,.stats b,.taxiw .tw2 b,.rank .p,.pamt,.pprice,.ptag,.toast,.card h3,.item b,.cbox .cprice,.ctag,.sec h3,.grp-h h3,.bprow.hd b,.xjoin>b,.xmine b,.vtile .nm,.xcard .xn,.pod b,.paycard b,.luck{font-style:normal}
/* фон: яркое небо вместо тёмной ночи */
#bgv{background:linear-gradient(180deg,rgba(40,30,140,.0),rgba(26,19,71,.25) 60%,rgba(26,19,71,.45))}
/* светлые панели: свои цвета текста внутри */
.card,.item,.rank,.offer,.clrow,.clmem,.stats>div,.xprize>div,.tile,.vtile,.xcard,.bpc:not(.prem),.pack,.taxiw,.empty,.drawer .mt,.drawer .swt,.qt,.coll .c,.contents .ci{--fg:var(--txt);--mute:var(--txt2);--gold:#e08600;--amber:#e07b00;--ok:#0fa765;color:var(--txt)}
.card,.item,.rank,.offer,.clrow,.clmem,.stats>div,.xprize>div,.tile,.vtile,.xcard,.bpc:not(.prem),.pack,.drawer .mt,.drawer .swt{background:linear-gradient(180deg,#ffffff 0%,#f3f2ff 60%,#e4e2ff 100%)!important;border:3px solid var(--ink)!important;box-shadow:0 5px 0 var(--ink)!important}
.card,.offer,.tile,.vtile,.xcard,.pack{border-radius:22px}
.item,.rank,.clrow,.clmem,.stats>div,.xprize>div{border-radius:18px}
.card .mute,.item .mute,.tile .mute,.rank .mute{color:var(--txt2)}
.stats b{color:var(--txt)}
.tile .vl{color:#e08600;text-shadow:none}
.tile{background:radial-gradient(90% 55% at 50% 30%,color-mix(in srgb,var(--rc) 45%,transparent),transparent 75%),linear-gradient(180deg,#ffffff,#eceaff)!important}
.tile .nm{color:var(--txt)}
.taxiw .tw2 b{color:#e08600;text-shadow:none}
.empty{background:rgba(255,255,255,.85)!important;border:3px dashed var(--ink)!important;color:var(--txt2)}
.empty b{color:var(--txt)}.empty svg{stroke:var(--txt2)}
select,input{background:#fff;color:var(--txt);border:3px solid var(--ink);box-shadow:inset 0 3px 0 rgba(26,19,71,.12)}
.bar{background:#d9d6f5;border:2.5px solid var(--ink)}
.bar>i{background:linear-gradient(180deg,#ff7ab0,#ff3d8b);border-radius:6px}
.bar.gold>i{background:linear-gradient(180deg,#ffe35c,#ffb300)}
.rank:nth-child(1){background:linear-gradient(180deg,#fff3a8,#ffd21f)!important}
.rank .p{color:var(--txt2)}
.banner{background:linear-gradient(180deg,#5fb2ff,#2f86ff);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);color:#fff;text-shadow:0 1px 0 rgba(26,19,71,.4)}
/* кнопки-конфеты: скругление, блик сверху, тёмный низ, пружина */
.btn{--bg:linear-gradient(180deg,#6fb4ff,#2f86ff 60%,#1f63e0);background:var(--bg)!important;border:3px solid var(--ink)!important;border-radius:16px;box-shadow:0 5px 0 var(--ink),inset 0 -5px 0 rgba(0,0,0,.18)!important;color:#fff!important;overflow:hidden;font-size:14px;padding:12px 18px 15px;text-shadow:0 2px 0 rgba(26,19,71,.55),1px 0 0 rgba(26,19,71,.5),-1px 0 0 rgba(26,19,71,.5),0 -1px 0 rgba(26,19,71,.4);transition:transform .28s cubic-bezier(.3,1.9,.45,1)}
.btn::before{content:"";position:absolute;inset:3px 6px auto 6px;height:42%;z-index:0;transform:none;border:0;border-radius:12px 12px 30px 30px/12px 12px 14px 14px;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.12));box-shadow:none;pointer-events:none}
.btn>*{position:relative;z-index:1}
.btn:active:not(:disabled){transform:translateY(4px) scale(.95);transition:transform .06s}
.btn:active:not(:disabled)::before{box-shadow:none}
.btn:active:not(:disabled){box-shadow:0 1px 0 var(--ink),inset 0 -2px 0 rgba(0,0,0,.18)!important}
.btn.pri{--bg:linear-gradient(180deg,#ffe56b,#ffc400 55%,#ff9500)}
.btn.ok{--bg:linear-gradient(180deg,#7dffb5,#1fd67a 55%,#0faa5e)}
.btn.gold{--bg:linear-gradient(180deg,#fff08a,#ffcc00 50%,#f09d00)}
.btn.bad{--bg:linear-gradient(180deg,#ff8a8a,#ff4a4a 55%,#d6243a)}
.btn.sm{padding:8px 13px 11px;font-size:12.5px;border-radius:13px;border-width:2.5px!important;box-shadow:0 4px 0 var(--ink),inset 0 -4px 0 rgba(0,0,0,.18)!important}
.btn.sm::before{inset:2px 5px auto 5px;border-radius:10px 10px 24px 24px/10px 10px 10px 10px}

function vFlake(x,y,s,c){let g='';for(let k=0;k<6;k++){const a=k*Math.PI/3,dx=Math.cos(a)*s,dy=Math.sin(a)*s;g+=`M${(x-dx).toFixed(1)} ${(y-dy).toFixed(1)}L${(x+dx).toFixed(1)} ${(y+dy).toFixed(1)}`}return `<path d="${g}" stroke="${c||'#fff'}" stroke-width="${(s*.18).toFixed(2)}" stroke-linecap="round"/>`}

function applyCredits(list){if(!list||!list.length)return;S.claimed=S.claimed||[];let got=0,ch=false;
 for(const c of list){if(S.claimed.includes(c.id))continue;S.claimed.push(c.id);ch=true;
  if(c.kind==='stars'){S.stars+=c.stars;got+=c.stars;if(c.paid)S.deposited=(S.deposited||0)+c.paid}
  else if(c.kind==='refund'){S.stars=Math.max(0,S.stars-c.stars);toast('Возврат оплаты: −'+fmt(c.stars)+' ★')}
  else if(c.kind==='friend'){S.st.friends++;S.tok.base++;toast((c.name||'Друг')+' пришёл по твоей ссылке: +1 базовый кейс')}
  else if(c.kind==='car'&&c.data&&c.data.car&&CARS[c.data.car.r]){const car=Object.assign({},c.data.car,{uid:uid(),taxi:false,num:null});S.cars.push(car);S.collected[car.r+':'+car.i]=1;
   if(c.data.why==='au_win')S.st.auWin=(S.st.auWin||0)+1;toast(c.data.why==='au_win'?'Ты выиграл аукцион: '+car.name:c.data.why==='au_back'?'Лот без ставок: '+car.name+' вернулась в гараж':c.data.why==='stars_off'?'Аукцион за звёзды закрыт: '+car.name+' вернулась в гараж':'Соперник не нашёлся — '+car.name+' в гараже')}
  else if(c.kind==='money'&&c.data){const a=+c.data.amount||0;S.money+=a;if(c.data.why==='expo'){celebrate(6,'#ffcf3f');SFX.reveal(6);if(+c.data.place===1)S.st.expoWin=(S.st.expoWin||0)+1}toast(c.data.why==='gift'?'Подарок от администрации: +'+rub(a):c.data.why==='expo'?'Выставка: '+(c.data.car||'твоя машина')+' — '+c.data.place+' место! +'+rub(a):(c.data.car||'Машина')+' продана на аукционе: +'+rub(a))}
  else if(c.kind==='level'&&c.data){const n=Math.max(1,Math.min(200,Math.floor(+c.data.lvl||1)));S.xp=n>1?Math.ceil(50*Math.pow(n-1,1.7))+1:0;S.lvlQ=[];toast('Администрация выдала тебе '+n+' уровень')}
  else if(c.kind==='bidback'&&c.data){const a=+c.data.amount||0;if(c.data.cur==='rub')S.money+=a;else S.stars+=a;toast(c.data.why==='stars_off'?'Аукцион за звёзды закрыт — ставка на '+(c.data.car||'лот')+' вернулась: +'+price(c.data.cur,a):'Твою ставку на '+(c.data.car||'лот')+' перебили — '+price(c.data.cur,a)+' вернулись')}
  else if(c.kind==='duel'&&c.data){if(DUELW&&DUELW.id===c.data.id&&!DUELW.done)finishDuel(c.data);else duelOffline(c.data)}
  if(c.kind==='stars'&&c.data&&c.data.why==='au_sold')toast((c.data.car||'Машина')+' продана на аукционе: +'+star(c.stars))}
 if(S.claimed.length>300)S.claimed=S.claimed.slice(-300);
 if(!ch)return;if(got){SFX.reveal(5);FX.burst(innerWidth/2,innerHeight*.35,['#ffcf3f','#fff','#ff9f1c'],70);toast('Зачислено '+fmt(got)+' ★')}
 save();hud();if(screen==='shop'||screen==='friends'||screen==='dep')render()}

 S.collected[r+':'+i]=1;if(r>S.st.bestR)S.st.bestR=r;return c}

function genPlate(t){const L=()=>pick(L_.split(''));const regs=['64','77','99','78','163','777','01','50','116','197','750','02'];let a,d,bc,reg=pick(regs);const SL=['А','О','М','Е','Х','Р','В','С','К'];
 if(t===0){a=L();bc=L()+L();do{d=String(ri(100,999))}while(d[0]===d[2]||d[0]===d[1])}
 else if(t===1){if(Math.random()<.5){const x=ri(1,9),y=(x+ri(1,8))%10;d=''+x+y+x;a=L();bc=L()+L()}else{const l=L();a=l;bc=l+l;do{d=String(ri(100,999))}while(d[0]===d[1]&&d[1]===d[2])}}
 else if(t===2){const x=ri(1,9);d=''+x+x+x;a=L();bc=L()+L()}
 else if(t===3){const x=ri(1,9),l=pick(SL);d=''+x+x+x;a=l;bc=l+l}
 else if(t===4){const s=pick([['А','МР'],['Е','КХ'],['О','ОО'],['В','ОР'],['Х','ХХ'],['С','СС'],['М','ММ']]);a=s[0];bc=s[1];d=pick(['777','555','999','111','100','200','500']);reg=pick(['77','99','97','199'])}
 else if(t===5){const l=pick(SL);a=l;bc=l+l;d=pick(['007','777','100','777']);reg=pick(['77','99','777','197'])}
 else if(t===6){const l=pick(['А','О','М','Е','Х']);a=l;bc=l+l;d=pick(['001','002','003','010']);reg=pick(['77','777','99','01'])}
 else{const l=pick(['А','О','Е','Х','М']);a=l;bc=l+l;d='001';reg=pick(['01','777','77'])}
 return{a,d,bc,reg}}

/* daily resets */
function ensureDaily(){const k=dayKey();
 if(S.tasks.day!==k){const pool=[...TASK_POOL].sort(()=>Math.random()-.5).slice(0,3);S.tasks={day:k,list:pool.map(p=>({id:p.id,p:0,done:false})),bonus:false}}
 if(S.ins.day!==k)S.ins={day:k,n:0};if(S.ret.day!==k)S.ret={day:k,n:0};if(S.ads.day!==k)S.ads={day:k,n:0}}
function checkLogin(){const k=dayKey();if(S.login.last===k)return;const y=dayKey(now()-864e5);S.login.streak=S.login.last===y?S.login.streak+1:1;S.login.last=k;S.login.pending=true;save()}

function pendingTaxi(){const el=Math.min(now()-S.lastCollect,TAXI_CAP);const rate=S.cars.filter(c=>c.taxi).reduce((a,c)=>a+carRate(c),0);return S.taxiBank+rate*el/3600e3}

function auBidAmt(l,d){if(l.cur==='rub')return l.bid?r4(l.bid*(1+d/100)):r4(l.start*(1+(d-5)/100));return l.bid?l.bid+d:5+d-1}
function newCarSilent(r){const L=CARS[r];const i=pick(L.map((c,j)=>j).filter(j=>!isEv(r,j)));return{uid:uid(),r,i,name:L[i][0],body:L[i][1],value:Math.round(ri(R[r].min,R[r].max)/100)*100,num:null,vinyl:null,washed:0,taxi:false,paint:ri(0,PAINTS.length-1)}}
function auStep(t){let changed=false;
 for(const l of S.au){if(l.closed)continue;const cur=l.cur||'star';
  if(t-l.last>=AU_LEN){closeLot(l);changed=true;continue}
  const p=l.leader==='me'?0.05:0.035;const nb=cur==='rub'?(l.bid?r4(l.bid*(1+ri(3,10)/100)):l.start):(l.bid?l.bid+ri(1,3):(l.start||5));
  if(nb<=l.cap&&Math.random()<p&&!(l.mine&&l.leader&&l.leader!=='me'&&Math.random()<.5)){
   const bidder=pick(BOTS.filter(b=>b!==l.leader&&b!==l.seller));
   if(l.leader==='me'){if(cur==='rub')S.money+=l.bid;else S.stars+=l.bid;toast('Твою ставку на '+l.car.name+' перебили')}
   l.bid=nb;l.leader=bidder;l.last=t;changed=true}}
 return changed}
function closeLot(l){l.closed=true;
 if(l.mine){if(l.leader){const get=Math.floor(l.bid*.9);if(l.cur==='rub')S.money+=get;else S.stars+=get;S.st.auSold++;toast(l.car.name+' продана за '+price(l.cur||'star',get))}else{l.car.taxi=false;S.cars.push(l.car);toast('Лот без ставок: '+l.car.name+' вернулась в гараж')}}
 else if(l.leader==='me'){l.car.fromAu=true;S.cars.push(l.car);S.collected[l.car.r+':'+l.car.i]=1;if(l.car.r>S.st.bestR)S.st.bestR=l.car.r;S.st.auWin++;toast('Ты выиграл аукцион: '+l.car.name)}}

const RARE_IDX=[15,16,17,18,19,20];
function rareAt(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()+(600+hashS('rare'+dayKey(t))%720)*60e3}
function rareNext(){if(PROD)return AU.rareNext||0;const t=now(),a=rareAt(t);return S.rareDay===dayKey(t)||t>=a?rareAt(t+864e5):a}
function spawnRare(t){[...RARE_IDX].sort(()=>Math.random()-.5).slice(0,3).forEach((i,k)=>{const m=CARS[8][i],v=Math.round(ri(8e6,2e7)*ECO/1e5)*1e5,cur='rub';

 S.au.push({id:uid(),car,seller:'Avto drop',rare:true,cur,start:cur==='rub'?r4(v*.5):50,cap:cur==='rub'?r4(v*(.9+Math.random()*.5)):ri(120,420),bid:0,leader:null,last:t+AU_LEN,mine:false})})}
function auTick(){if(PROD)return false;let ch=false;const t=now();while(S.auSim+600e3<=t){S.auSim+=600e3;if(auStep(S.auSim))ch=true}
 for(const l of S.au)if(!l.closed&&t-l.last>=AU_LEN){closeLot(l);ch=true}
 S.au=S.au.filter(l=>!l.closed||t-l.last<AU_LEN+6*3600e3);
 for(const l of S.au){if(!l.closed&&l.cur!=='rub'){l.closed=true;ch=true;if(l.leader==='me')S.stars+=l.bid;if(l.mine){l.car.taxi=false;S.cars.push(l.car)}continue}if(!l.cur)l.cur='star';if(l.start==null)l.start=5;if(!l.closed&&!l.mine&&l.car.value<AU_MIN){if(l.leader==='me')S.stars+=l.bid;l.closed=true;ch=true}}
 {const k=dayKey(t);if(S.rareDay!==k&&t>=rareAt(t)){S.rareDay=k;spawnRare(t);ch=true}}
 for(const cur of ['rub']){const open=S.au.filter(l=>!l.closed&&!l.mine&&l.cur===cur&&!l.rare).length;for(let i=open;i<5;i++){S.au.push(botLot(cur));ch=true}}
 return ch}

function rpmOf(o){return Math.min(1,o.v/(GEAR[o.g]*o.s.vmax))}

function subGate(next){let passed=false;const pass=()=>{if(passed)return;passed=true;document.removeEventListener('visibilitychange',onVis);const o=document.getElementById('subov');if(o)o.remove();next()};
 const check=(manual)=>api('sub').then(j=>{if(!j||j.ok)return pass();show(j.channel);if(manual)toast('Подписка пока не видна — подпишись и нажми ещё раз')}).catch(pass);
 const onVis=()=>{if(!document.hidden&&!passed)check(false)};

  let o=document.getElementById('subov');if(!o){o=document.createElement('div');o.id='subov';const bg=getComputedStyle(document.body).backgroundColor;o.style.background=(!bg||bg==='rgba(0, 0, 0, 0)')?'#14171e':bg;document.body.appendChild(o)}

  $('#sgGo').onclick=()=>{try{TG&&TG.openTelegramLink?TG.openTelegramLink(url):open(url,'_blank')}catch(e){open(url,'_blank')}};
  $('#sgChk').onclick=()=>check(true)};
 document.addEventListener('visibilitychange',onVis);check(false)}
if(PROD){$('#view').innerHTML='<div class="boot"><div class="spin"></div><span class="mute">Загружаем гараж…</span></div>';let done=false;
 const go=()=>{if(done)return;done=true;subGate(startUI)};setTimeout(go,7000);
 api('load').then(j=>{if(j&&j.feed)setFeed(j.feed);if(j&&j.now)SRV_OFF=j.now-Date.now();if(done)return;if(j&&j.save&&(+j.save.savedAt||0)>(+S.savedAt||0)){S=Object.assign(fresh(),j.save,{eco:j.save.eco||1});migrate()}if(j&&j.clan!==undefined)setMyClan(j.clan);go();if(j&&j.credits)applyCredits(j.credits);if(!j||!j.save)cloudSave()}).catch(go)}
else if(API){$('#view').innerHTML=`<div class="boot"><b style="font-family:var(--display);font-size:20px">Avto drop</b><span class="mute">Игра работает внутри Telegram</span><a class="btn pri" href="https://t.me/${BOT}">Открыть @${BOT}</a></div>`}
else startUI();
document.addEventListener('visibilitychange',()=>{if(document.hidden){try{localStorage.setItem('avtodrop_v1',JSON.stringify(S))}catch(e){}cloudSave(true)}else if(PROD)waitCredits(0)});
