/* Layout: one-screen phone app — sticky top bar, scrolling view, fixed bottom nav, side drawer behind "три полоски" */
:root{
  --asphalt:#14171e; --panel:#1d212b; --panel2:#262b37; --line:#343b4b;
  --fg:#eef0f5; --mute:#8e96a8; --amber:#ffb53d; --amber-ink:#2a1a00;
  --ok:#4fc27b; --bad:#ef5a5a;
  --display:"Russo One","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--asphalt);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
select,input{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:20px}
h3{font-size:16px}
.num{font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.small{font-size:12px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:linear-gradient(var(--asphalt) 80%,transparent)}
.burger{width:40px;height:40px;border-radius:12px;background:var(--panel);display:grid;place-content:center;gap:4px;flex:none}
.burger i{display:block;width:18px;height:2px;background:var(--fg);border-radius:2px}
.who{min-width:0;flex:1}
.who b{font-family:var(--display);font-weight:400;font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:11px;color:var(--mute)}
.bal{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-weight:800;font-size:13px}
.bal .st{color:var(--amber)}
.luck{font-size:10px;font-weight:800;color:var(--amber-ink);background:var(--amber);border-radius:6px;padding:1px 6px}

main{padding:4px 16px calc(96px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--mute);padding:4px 0;border-radius:10px}
nav.tabs button[aria-current="true"]{color:var(--amber)}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,7,12,.6);z-index:40}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(84vw,320px);background:var(--panel);z-index:41;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto;display:flex;flex-direction:column;gap:4px;transform:translateX(-102%);transition:transform .22s ease}
.drawer.open{transform:none}
.drawer h3{padding:4px 10px 10px;color:var(--amber)}
.drawer .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:12px 10px 4px}
.drawer button{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:11px 10px;border-radius:10px;font-weight:600}
.drawer button:hover,.drawer button[aria-current="true"]{background:var(--panel2)}
.dot{min-width:18px;height:18px;border-radius:9px;background:var(--bad);font-size:11px;font-weight:800;display:inline-grid;place-content:center;padding:0 5px;color:#fff}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;font-weight:800;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.btn.pri{background:var(--amber);color:var(--amber-ink);border-color:transparent}
.btn.ok{background:var(--ok);color:#06210f;border-color:transparent}
.btn.bad{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:7px 11px;font-size:12px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1}

/* panels */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.item .grow{flex:1;min-width:0}
.item .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--amber);border-radius:4px}
.seg{display:flex;background:var(--panel);border-radius:12px;padding:3px;gap:2px;overflow-x:auto}
.seg button{flex:1;padding:8px 10px;border-radius:10px;font-weight:700;font-size:12px;color:var(--mute);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--fg)}

/* rarity */
.rb{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;color:#0b0d12}
.r8 .rb,.rb.r8{background:linear-gradient(90deg,#ff5fd2,#ffb53d,#5fe0ff)}

/* car art */
.art{position:relative;width:100%;aspect-ratio:120/48}
.art .paint,.art svg,.art img{position:absolute;inset:0;width:100%;height:100%}
.art img{pointer-events:none;-webkit-user-drag:none;user-select:none}
.art .paint{-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.anim-slide{animation:slide 4s linear infinite}
.anim-hue{animation:hue 5s linear infinite}
@keyframes slide{to{background-position:300% 0}}
@keyframes hue{to{filter:hue-rotate(360deg)}}

/* car tiles */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--rc)}
.tile .nm{font-weight:800;font-size:13px;line-height:1.2;min-height:2.4em}
.tile .vl{font-weight:800;font-size:12px}
.tile .rb{align-self:flex-start}
.tile .tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--panel2);color:var(--mute)}
.tag.taxi{background:var(--amber);color:var(--amber-ink)}
.tag.wash{background:#1d4d6b;color:#bfe7ff}

/* cases */
.case{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;position:relative;overflow:hidden}
.box{width:96px;height:96px;border-radius:16px;display:grid;place-content:center;position:relative;background:var(--cc);box-shadow:inset 0 -10px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.25)}
.box::after{content:"";position:absolute;left:0;right:0;top:40%;height:10px;background:rgba(0,0,0,.25)}
.box b{font-family:var(--display);font-size:30px;color:rgba(0,0,0,.55);position:relative;z-index:1}
.case .grow{display:flex;flex-direction:column;gap:8px;min-width:0}
.chances{display:flex;height:6px;border-radius:3px;overflow:hidden}
.chances i{display:block;height:100%}

/* plate */
.plate{display:inline-flex;align-items:stretch;background:#f5f6f2;color:#111;border:2px solid #111;border-radius:6px;font-family:var(--display);line-height:1;white-space:nowrap;box-shadow:0 1px 0 rgba(255,255,255,.2)}
.plate .pm{padding:4px 6px 3px;font-size:15px;letter-spacing:.02em;display:flex;align-items:baseline;gap:1px}
.plate .pm b{font-weight:400;font-size:19px;margin:0 2px}
.plate .pr{border-left:2px solid #111;padding:2px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.plate .pr i{font-style:normal;font-size:13px}
.plate .pr small{font-family:var(--body);font-size:7px;font-weight:800;display:flex;align-items:center;gap:2px}
.plate .pr small::after{content:"";width:9px;height:6px;background:linear-gradient(#fff 0 33%,#1c3fa8 33% 66%,#d52b1e 66%);border:.5px solid #999}
.plate.sm .pm{font-size:11px;padding:2px 4px}
.plate.sm .pm b{font-size:13px}
.plate.sm .pr i{font-size:9px}
.plate.sm .pr small{font-size:5px}

/* modal */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,7,12,.7)}
.sheet{width:100%;max-width:520px;max-height:92%;overflow-y:auto;background:var(--panel);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:560px){.modal{align-items:center}.sheet{border-radius:22px}}
.sheet .x{align-self:flex-end;margin-bottom:-36px;width:32px;height:32px;border-radius:16px;background:var(--panel2);font-weight:800}

/* roulette */
.roul{position:relative;overflow:hidden;border-radius:14px;background:var(--asphalt);padding:10px 0}
.roul::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--amber);z-index:2;box-shadow:0 0 10px var(--amber)}
.strip{display:flex;gap:8px;will-change:transform}
.ri{flex:none;width:104px;background:var(--panel);border-radius:10px;padding:8px 6px 6px;border-bottom:3px solid var(--rc);display:flex;flex-direction:column;gap:4px;align-items:center}
.ri small{font-size:10px;font-weight:700;text-align:center;line-height:1.15;height:2.3em;overflow:hidden}

.result{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:6px 0}
.result .art{max-width:300px}
.glow{font-family:var(--display);font-size:22px}

/* wash */
.washer{position:relative;user-select:none;-webkit-user-select:none;touch-action:manipulation;background:radial-gradient(ellipse at 50% 85%,#22314a,var(--panel) 70%);border-radius:18px;padding:30px 16px 22px;display:flex;flex-direction:column;align-items:center;gap:10px;overflow:hidden}
.washer .art{max-width:320px;transition:transform .08s}
.washer:active .art{transform:scale(.97)}
.dirt{position:absolute;inset:0;background:radial-gradient(circle at 20% 60%,#5a4632 0 9%,transparent 10%),radial-gradient(circle at 45% 40%,#6b5539 0 7%,transparent 8%),radial-gradient(circle at 70% 65%,#4f3e2b 0 10%,transparent 11%),radial-gradient(circle at 85% 45%,#6b5539 0 6%,transparent 7%),radial-gradient(circle at 30% 30%,#5a4632 0 5%,transparent 6%);-webkit-mask-size:100% 100%;mask-size:100% 100%;pointer-events:none}
.pop{position:absolute;font-weight:800;color:var(--amber);pointer-events:none;animation:pop .7s ease-out forwards}
@keyframes pop{to{transform:translateY(-50px);opacity:0}}
.bubbles{position:absolute;inset:0;pointer-events:none}

/* table rows */
.rank{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--panel)}
.rank.me{outline:1px solid var(--amber)}
.rank .p{font-family:var(--display);color:var(--mute)}
.rank:nth-child(-n+3) .p{color:var(--amber)}

.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);animation:toastin .3s cubic-bezier(.2,1.4,.4,1);z-index:80;background:var(--fg);color:var(--asphalt);font-weight:800;padding:10px 16px;border-radius:12px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
@keyframes toastin{from{transform:translate(-50%,-30px);opacity:0}}
.banner{background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--mute)}
.adov{position:fixed;inset:0;z-index:90;background:#000;display:grid;place-content:center;text-align:center;gap:10px;color:#fff}
.bp{display:grid;grid-template-columns:44px 1fr 1fr;gap:8px;align-items:stretch}
.bp .lv{font-family:var(--display);display:grid;place-content:center;background:var(--panel);border-radius:10px}
.bp .rw{background:var(--panel);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;justify-content:space-between;font-size:12px;font-weight:700;min-width:0}
.bp .rw.lock{opacity:.45}
.bp .rw.prem{background:linear-gradient(160deg,#3a2a10,var(--panel) 60%)}
.coll{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.coll .c{background:var(--panel);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:3px;font-size:10px;font-weight:700;text-align:center;line-height:1.15;min-width:0}
.coll .c.off .art{filter:brightness(0) opacity(.35)}
.coll .c.off span{color:var(--mute)}
/* ===== v2: ночной город, стекло, анимации ===== */
:root{--asphalt:#090b16;--panel:rgba(22,25,42,.74);--panel2:rgba(44,50,76,.72);--solid:#151829;--line:rgba(140,155,210,.16);--cyan:#53e0ff;--pink:#ff4fa3}
body{background:var(--asphalt)}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;display:block}
#bg{z-index:0}
#bgs{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle 70vmax at 50% 100%,rgba(255,120,80,.55),rgba(200,50,140,.18) 35%,transparent) top/100% 66% no-repeat,linear-gradient(180deg,#05061a,#1a1240 36%,#4a1d55 56%,#ff6a4d 66%,#1b1530 66%,#07080f)}
#fx{z-index:95}
main{position:relative;z-index:1}
.top{background:linear-gradient(rgba(9,11,22,.94) 65%,rgba(9,11,22,0))}
nav.tabs{background:rgba(14,16,30,.82);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%)}
nav.tabs button[aria-current="true"] svg{animation:navpop .45s cubic-bezier(.3,1.8,.5,1);filter:drop-shadow(0 0 6px rgba(255,181,61,.7))}
nav.tabs button{position:relative}
nav.tabs button[aria-current="true"]::before{content:"";position:absolute;top:-7px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--amber);box-shadow:0 0 12px var(--amber)}
@keyframes navpop{40%{transform:translateY(-5px) scale(1.2)}}
.drawer,.sheet{background:var(--solid)}
.drawer{box-shadow:20px 0 60px rgba(0,0,0,.5)}
.drawer button{transition:background .15s,transform .15s}
.drawer button:active{transform:scale(.97)}
.burger{background:var(--panel2);transition:transform .15s}
.burger:active{transform:scale(.9)}
.card,.item,.tile,.rank,.banner{box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.sheet{border:1px solid var(--line);border-bottom:0;animation:sheetin .38s cubic-bezier(.2,.9,.3,1)}
.modal{animation:fadein .25s}
@keyframes sheetin{from{transform:translateY(60px);opacity:0}}
@keyframes fadein{from{opacity:0}}
.btn{position:relative;overflow:hidden;transition:transform .12s,filter .2s,box-shadow .2s}
.btn:active:not(:disabled){transform:scale(.95)}
.btn.pri{background:linear-gradient(180deg,#ffd77f,#ffad2f 55%,#f0890f);box-shadow:0 8px 20px -8px rgba(255,165,30,.8),inset 0 1px 0 rgba(255,255,255,.55)}
.btn.pri::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:sweep 3.2s ease-in-out infinite;will-change:transform}
.btn.ok{background:linear-gradient(180deg,#86e9a9,#3cb469);box-shadow:0 8px 20px -10px rgba(70,220,120,.8)}
@keyframes sweep{0%,60%{transform:translateX(0) skewX(-20deg)}100%{transform:translateX(var(--sw,475%)) skewX(-20deg)}}
.tile{background:radial-gradient(120% 80% at 50% 30%,color-mix(in srgb,var(--rc) 22%,transparent),transparent 70%),var(--panel);transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile .art{filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
.tile.drive .art{animation:bob .45s ease-in-out infinite}
.drive .wh,.spin .wh{transform-box:fill-box;transform-origin:center;animation:spin .5s linear infinite}
.tile.drive::after{content:"";position:absolute;left:10px;right:10px;top:calc(10px + (100% - 20px) * 0);height:0}
.road{height:3px;margin:-4px 6px 2px;background:repeating-linear-gradient(90deg,rgba(255,200,80,.8) 0 10px,transparent 10px 20px);background-size:20px 3px;animation:road .3s linear infinite;border-radius:2px;opacity:.7}
@keyframes road{to{background-position:-20px 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-3px)}}
#view.v-in>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
#view.v-in>*:nth-child(2){animation-delay:.05s}#view.v-in>*:nth-child(3){animation-delay:.1s}#view.v-in>*:nth-child(4){animation-delay:.15s}#view.v-in>*:nth-child(5){animation-delay:.2s}#view.v-in>*:nth-child(n+6){animation-delay:.25s}
#view.v-in .grid>*,#view.v-in .cgrid>*,#view.v-in .list>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 45ms + .1s)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}}
.bump{animation:bump .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{40%{transform:scale(1.18)}}

/* кейсы */
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:560px){.cgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cbox{position:relative;border-radius:20px;padding:0 8px 12px;overflow:hidden;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;background:linear-gradient(170deg,color-mix(in srgb,var(--c1) 55%,#0b0d18) 0%,rgba(18,21,36,.92) 62%);border:1px solid color-mix(in srgb,var(--c1) 45%,transparent);box-shadow:0 12px 30px -16px var(--c1),inset 0 1px 0 rgba(255,255,255,.15);transition:transform .15s}
.cbox:active{transform:scale(.96)}
.cbox::after{content:"";position:absolute;top:-20%;bottom:-20%;left:-70%;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-18deg);animation:sweep 4.5s ease-in-out infinite;--sw:420%;will-change:transform;animation-delay:var(--dl,0s);pointer-events:none}
.cstage{position:relative;width:calc(100% + 16px);aspect-ratio:1.35;display:grid;place-items:center;overflow:hidden}
.rays{position:absolute;inset:-45%;background:repeating-conic-gradient(var(--c1) 0 7deg,transparent 7deg 20deg);opacity:.28;animation:spin 16s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 12%,transparent 55%);mask-image:radial-gradient(circle,#000 12%,transparent 55%)}
.glowb{position:absolute;width:75%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--c1),transparent 65%);opacity:.55;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.9)}}
.float{position:relative;width:88%;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 10px 10px rgba(0,0,0,.5))}
.cbox .cname{font-family:var(--display);font-size:15px;line-height:1.1}
.cbox .chances{width:100%;height:4px;opacity:.85}
.case{background:linear-gradient(110deg,rgba(40,30,60,.85),var(--panel) 60%)}
.box{background:linear-gradient(160deg,var(--cc),#222 140%);animation:bob 3s ease-in-out infinite}
.cbox .cprice{font-weight:800;font-size:13px;padding:5px 12px;border-radius:999px;background:rgba(0,0,0,.35);color:var(--amber);font-variant-numeric:tabular-nums}
.ctag{position:absolute;top:8px;left:8px;z-index:2;font-size:9px;font-weight:800;letter-spacing:.06em;padding:3px 7px;border-radius:6px;background:var(--c1);color:#0b0d12}
.cfree{position:absolute;top:8px;right:8px;z-index:2;font-size:9px;font-weight:800;padding:3px 7px;border-radius:6px;background:var(--ok);color:#06210f;animation:pulse 1.4s infinite}
.grp-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:4px}
.grp-h h3{font-size:15px}
.contents{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.contents .ci{border-radius:10px;padding:6px 4px 5px;background:var(--panel2);border-bottom:2px solid var(--rc);display:flex;flex-direction:column;gap:2px;align-items:center;font-size:9.5px;font-weight:700;line-height:1.1;text-align:center;min-width:0}
.prestage{position:relative;display:grid;place-items:center;padding:20px 0}
.prestage .cbox{width:200px;animation:shake .9s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translateX(-2px) rotate(-1deg)}20%,80%{transform:translateX(4px) rotate(2deg)}30%,50%,70%{transform:translateX(-7px) rotate(-3deg) scale(1.03)}40%,60%{transform:translateX(7px) rotate(3deg) scale(1.05)}100%{transform:scale(1.25);opacity:0}}

/* рулетка и раскрытие */
.roul{background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(20,24,44,.6),rgba(0,0,0,.5));box-shadow:inset 0 0 30px rgba(0,0,0,.7)}
.roul::before{width:3px;margin-left:-1.5px;background:linear-gradient(var(--amber),#fff,var(--amber));box-shadow:0 0 14px 2px var(--amber)}
.roul::after{content:"";position:absolute;left:50%;top:0;margin-left:-8px;border:8px solid transparent;border-top-color:var(--amber);z-index:3;filter:drop-shadow(0 0 6px var(--amber))}
.roul .fade{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(90deg,rgba(9,11,22,.95),transparent 25%,transparent 75%,rgba(9,11,22,.95))}
.ri{position:relative;overflow:hidden;background:rgba(30,34,54,.9)}
.ri::before{content:"";position:absolute;left:10%;right:10%;bottom:-35%;height:75%;background:var(--rc);filter:blur(16px);opacity:.5}
.ri>*{position:relative}
.reveal{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:8px 0 4px;overflow:hidden;isolation:isolate}
.reveal .rays{inset:auto;left:50%;top:30%;width:560px;height:560px;margin:-280px 0 0 -280px;--c1:var(--rc);opacity:.4;z-index:-1}
.reveal .glowb{left:50%;top:30%;width:260px;margin:-130px 0 0 -130px;--c1:var(--rc);z-index:-1}
.reveal .car{width:min(310px,88%);animation:popin .75s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 14px 14px rgba(0,0,0,.6))}
.reveal .rb{animation:rise .4s .25s both}
@keyframes popin{from{transform:scale(.2) rotate(-8deg);opacity:0}}
.shimmer{background:linear-gradient(90deg,var(--rc) 25%,#fff 50%,var(--rc) 75%) 0 0/200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 2.2s linear infinite,rise .4s .3s both}
@keyframes shim{to{background-position:-200% 0}}
.flash{position:fixed;inset:0;z-index:96;pointer-events:none;animation:flash .7s ease-out forwards}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.screenshake{animation:sshake .5s}
@keyframes sshake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}

/* апгрейд-колесо */
.wheel{position:relative;width:min(230px,66vw);aspect-ratio:1;margin:4px auto}
.wheel svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.needle{position:absolute;inset:0;transition:transform 3.4s cubic-bezier(.12,.8,.14,1)}
.wheel .pct{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-family:var(--display);font-size:30px}
.wheel .pct small{font-family:var(--body);font-size:11px;color:var(--mute);font-weight:700}

/* мойка */
.washer{background:radial-gradient(ellipse at 50% 90%,rgba(83,224,255,.25),transparent 60%),linear-gradient(180deg,rgba(30,50,80,.6),rgba(15,20,36,.8));border:1px solid var(--line)}
.bub{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.95),rgba(170,230,255,.35) 45%,rgba(170,230,255,.08));animation:bub 1.1s ease-out forwards}
@keyframes bub{to{transform:translate(var(--dx),-70px) scale(1.4);opacity:0}}
.spray{position:absolute;top:0;left:50%;width:6px;height:100%;margin-left:-3px;background:linear-gradient(rgba(140,220,255,.0),rgba(140,220,255,.5));filter:blur(2px);opacity:0;pointer-events:none}
.washer:active .spray{opacity:1}

/* монеты, дуэль */
.coin{position:fixed;z-index:97;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c4,#ffc23d 45%,#c4800f);box-shadow:0 0 12px rgba(255,190,60,.9);pointer-events:none}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:8px 0}
.vs .pl{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;min-width:0;text-align:center}
.vs .av{width:58px;height:58px;border-radius:50%;display:grid;place-content:center;font-family:var(--display);font-size:22px;color:#0b0d12}
.vs .pl:first-child{animation:inL .6s cubic-bezier(.2,1.4,.4,1) both}
.vs .pl:last-child{animation:inR .6s cubic-bezier(.2,1.4,.4,1) both}
.vs b.v{font-family:var(--display);font-size:34px;color:var(--amber);text-shadow:0 0 18px var(--amber);animation:slam .5s .45s cubic-bezier(.2,1.8,.4,1) both}
@keyframes inL{from{transform:translateX(-120%);opacity:0}}
@keyframes inR{from{transform:translateX(120%);opacity:0}}
@keyframes slam{from{transform:scale(3);opacity:0}}
.lead{animation:leadglow 1.6s ease-in-out infinite}
@keyframes leadglow{50%{opacity:1}}
.gift{width:84px;height:84px;margin:0 auto;border-radius:18px;background:linear-gradient(160deg,#ffd77f,#f0890f);position:relative;animation:giftb 1.2s ease-in-out infinite;box-shadow:0 10px 30px -10px #ffad2f}
.gift::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:14px;margin-left:-7px;background:#e8473f}
.gift::after{content:"";position:absolute;top:30%;left:0;right:0;height:14px;background:#e8473f}
@keyframes giftb{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-6px)}}
.snd{width:40px;height:40px;border-radius:12px;background:var(--panel2);display:grid;place-content:center;flex:none;transition:transform .15s,color .2s}
.snd:active{transform:scale(.9)}
.snd[aria-pressed="false"]{color:var(--mute)}
.snd svg,.fastt svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fastt{display:inline-flex;align-items:center;gap:6px;padding:6px 10px 6px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-weight:800;font-size:12px;color:var(--mute);transition:background .2s,color .2s,box-shadow .2s}
.fastt svg{width:16px;height:16px}
.fastt[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink);border-color:transparent;box-shadow:0 0 18px -4px var(--amber)}
.fastt[aria-pressed="true"] svg{fill:currentColor}
.fastt .sw{width:26px;height:14px;border-radius:7px;background:rgba(0,0,0,.35);position:relative}
.fastt .sw::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:currentColor;transition:transform .2s}
.fastt[aria-pressed="true"] .sw::after{transform:translateX(12px)}
.roul,.prestage,.wheel{cursor:pointer}
.skiphint{text-align:center;margin:-6px 0 0;cursor:pointer;animation:pulse 1.6s ease-in-out infinite}
/* v3: лента, бесплатный кейс, гарант, мультиоткрытие, выбор в гараже */
.feedw{display:flex;align-items:center;gap:8px;min-width:0}
.live{flex:none;font-size:10px;font-weight:800;letter-spacing:.08em;color:#fff;background:#e5484d;border-radius:6px;padding:3px 6px;animation:pulse 1.4s ease-in-out infinite}
.feed{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.feed::-webkit-scrollbar{display:none}
.fi{flex:none;width:96px;border-radius:12px;background:radial-gradient(90% 70% at 50% 30%,color-mix(in srgb,var(--rc) 30%,transparent),transparent 70%),var(--panel);border:1px solid var(--line);border-bottom:2px solid var(--rc);padding:4px 6px 5px;display:flex;flex-direction:column;gap:1px;font-size:10px;line-height:1.15;min-width:0}
.fi b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi span{color:var(--mute);font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi.me span{color:var(--amber);font-weight:800}
.fi.new{animation:feedin .55s cubic-bezier(.2,1.3,.4,1)}
@keyframes feedin{from{margin-left:-104px;opacity:0;transform:scale(.6)}}
.fcase{display:grid;grid-template-columns:44% 1fr;gap:10px;align-items:center;padding:0 12px 0 0;text-align:left}
.fcase .cstage{width:calc(100% + 8px);margin-left:-8px}
.fcase .fbody{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0;padding:12px 0}
.fcase .ctag{position:static}
.fcase .cname{font-size:18px}
.fcase.ready .cprice{background:var(--ok);color:#06210f;animation:pulse 1.6s ease-in-out infinite}
.pity{width:100%;height:4px;border-radius:2px;background:rgba(0,0,0,.4);overflow:hidden}
.pity i{display:block;height:100%;background:linear-gradient(90deg,var(--c1,var(--amber)),#fff)}
.ptxt{font-size:10px;font-weight:700;color:var(--mute);margin-top:-2px}
.cnt{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.cnt button{padding:9px 0;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;transition:transform .12s}
.cnt button:active{transform:scale(.9)}
.cnt button[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink);border-color:transparent;box-shadow:0 0 14px -4px var(--amber)}
.mstrips{display:flex;flex-direction:column;gap:6px}
.roul.sm{padding:5px 0;border-radius:10px}
.ri.sm{width:76px;padding:5px 4px 4px}
.ri.sm small{font-size:8.5px;height:2.2em}
#mAct{flex-direction:column;align-items:stretch}
.numi{flex-wrap:wrap}
.numi .nbtn{width:100%;justify-content:flex-end;gap:6px}
#mAct .btn{white-space:normal}
.msum{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.msum .num{color:var(--amber);font-size:18px}
.mres{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.mtile{position:relative;background:radial-gradient(100% 70% at 50% 30%,color-mix(in srgb,var(--rc) 28%,transparent),transparent 70%),var(--panel);border:1px solid var(--line);border-bottom:3px solid var(--rc);border-radius:12px;padding:6px 5px;display:flex;flex-direction:column;gap:3px;align-items:center;text-align:center;font-size:10.5px;font-weight:700;min-width:0;animation:popin .5s both;animation-delay:calc(var(--i) * 70ms);transition:opacity .25s,filter .25s}
.mtile .nm{line-height:1.15;min-height:2.3em;display:flex;align-items:center}
.mtile .rb{font-size:8px;padding:1px 5px}
.mtile .mp{position:absolute;top:4px;left:4px;font-size:8px;padding:1px 4px;z-index:1}
.mtile.sel{outline:2px solid var(--amber);outline-offset:1px}
.mtile.sold{opacity:.35;filter:grayscale(1);pointer-events:none}
.mtile.sold::after{content:"ПРОДАНО";position:absolute;top:38%;left:0;right:0;font-family:var(--display);font-size:13px;color:var(--fg);transform:rotate(-12deg)}
.grid.selmode .tile::after{content:"";position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:7px;border:2px solid rgba(255,255,255,.7);background:rgba(0,0,0,.45);display:grid;place-content:center;font-weight:900;font-size:14px;color:var(--amber-ink)}
.grid.selmode .tile.sel::after{content:"✓";background:var(--amber);border-color:var(--amber)}
.grid.selmode .tile.sel{outline:2px solid var(--amber)}
.selbar{position:fixed;left:16px;right:16px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:14px;background:var(--solid);border:1px solid var(--amber);box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:608px;margin:0 auto;animation:rise .3s both}
/* ===== v4: игровой интерфейс — объёмные кнопки, иконки-плитки, стеклянные карточки ===== */
:root{--asphalt:#0a0817;--panel:rgba(40,32,88,.55);--panel2:rgba(70,58,140,.45);--solid:#17132f;--line:rgba(176,160,255,.16);--fg:#f6f4ff;--mute:#a9a3cf;--amber:#ffb02e;--amber-ink:#2b1500;--ok:#2fd27a;--bad:#ff4d6a;--gold:#ffcf3f;--vio:#8b5cff;
 --display:"Unbounded","Russo One","Arial Black",system-ui,sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.01em}
h2{font-size:21px}h3{font-size:15px;font-weight:700}
.glow,.cbox .cname,.vs b.v,.wheel .pct,.rank .p,.bp .lv,.msum,.plate{font-family:var(--display);font-weight:800}
.plate{font-weight:700}
main{gap:14px;padding:6px 16px calc(104px + env(safe-area-inset-bottom,0px))}
/* верхний бар */
.top{gap:8px;padding:10px 12px 14px;background:linear-gradient(rgba(10,8,23,.96) 70%,rgba(10,8,23,0))}
.burger{width:42px;height:42px;border-radius:14px;background:linear-gradient(180deg,#3d3274,#261f50);box-shadow:0 3px 0 #120e28,inset 0 1px 0 rgba(255,255,255,.18);transition:transform .08s,box-shadow .08s}
.burger:active{transform:translateY(2px);box-shadow:0 1px 0 #120e28}
.who{display:flex;align-items:center;gap:9px;min-width:0;flex:1;text-align:left;padding:0}
.who .wt{display:flex;flex-direction:column;min-width:0}
.who b{font-family:var(--display);font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .wt span{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ava{--p:0%;flex:none;width:38px;height:38px;border-radius:50%;padding:3px;background:conic-gradient(var(--gold) var(--p),rgba(255,255,255,.14) 0);position:relative;display:grid}
.ava b{display:grid;place-content:center;border-radius:50%;background:linear-gradient(160deg,#9a6bff,#ff4f8b);font-family:var(--display);font-weight:800;font-size:15px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.ava i{position:absolute;right:-5px;bottom:-4px;font-style:normal;font-family:var(--display);font-size:10px;font-weight:800;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:linear-gradient(180deg,#ffe07a,#ffb21a);color:#3a2000;display:grid;place-content:center;border:2px solid #0a0817}
.ava.lg{width:52px;height:52px}.ava.lg b{font-size:20px}
.ava.xl{width:78px;height:78px;padding:4px}.ava.xl b{font-size:30px}.ava.xl i{font-size:12px;height:26px;min-width:26px;border-radius:13px}
.pills{display:flex;gap:6px;flex:none}
.pill{display:flex;align-items:center;gap:5px;height:36px;padding:0 11px 0 5px;border-radius:18px;background:rgba(8,6,20,.7);border:1px solid var(--line);font-family:var(--display);font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--fg);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.pill .cur{width:26px;height:26px;flex:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.pill.stars{padding-right:5px;transition:transform .08s}
.pill.stars:active{transform:scale(.95)}
.pill .plus{width:24px;height:24px;border-radius:12px;display:grid;place-content:center;background:linear-gradient(180deg,#6ff3a6,#1fbf62);box-shadow:0 2px 0 #0e7a3a;color:#033118;font-weight:900;font-size:17px;line-height:1;margin-left:3px}
.pill.bump{animation:bump .45s cubic-bezier(.3,1.8,.5,1)}
.luckbar{position:fixed;left:0;right:0;top:calc(62px + env(safe-area-inset-top,0px));z-index:19;display:flex;justify-content:center;pointer-events:none}
.luck{display:inline-flex;align-items:center;gap:5px;font-family:var(--display);font-size:10.5px;font-weight:700;color:#073b1d;background:linear-gradient(90deg,#7dffb0,#22c870);border-radius:10px;padding:4px 10px;box-shadow:0 4px 14px -4px #22c870}
.luck svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
/* иконки-плитки */
.ico{--ic:#8b5cff;flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-content:center;background:linear-gradient(160deg,color-mix(in srgb,var(--ic),#fff 35%),var(--ic) 50%,color-mix(in srgb,var(--ic),#000 22%));box-shadow:0 3px 0 color-mix(in srgb,var(--ic),#000 55%),inset 0 1px 0 rgba(255,255,255,.5);position:relative}
.ico svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 0 rgba(0,0,0,.3))}
.ico.sm{width:30px;height:30px;border-radius:10px;box-shadow:0 2px 0 color-mix(in srgb,var(--ic),#000 55%),inset 0 1px 0 rgba(255,255,255,.5)}.ico.sm svg{width:17px;height:17px}
.ico.lg{width:50px;height:50px;border-radius:16px}.ico.lg svg{width:27px;height:27px}
/* заголовки экранов */
.shead{display:flex;align-items:center;gap:12px;min-width:0}
.shead .st{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.shead h2{font-size:21px;line-height:1.1}
.shead .st>span{font-size:12px;color:var(--mute);line-height:1.3}
.sec h3{font-size:14px;color:var(--mute);font-weight:700}
/* объёмные кнопки */
.btn{--b1:#4c4588;--b2:#342d68;--b3:#1c1742;font-family:var(--display);font-weight:700;font-size:12.5px;letter-spacing:.01em;border:0;border-radius:14px;padding:12px 16px 13px;color:#fff;background:linear-gradient(180deg,var(--b1),var(--b2));box-shadow:0 4px 0 var(--b3),0 10px 18px -10px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .08s,box-shadow .08s,filter .2s;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--b3),0 4px 10px -8px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.pri{--b1:#ffd65a;--b2:#ff9416;--b3:#b45700;background:linear-gradient(180deg,var(--b1),var(--b2));color:#3a1c00;text-shadow:0 1px 0 rgba(255,255,255,.35);box-shadow:0 4px 0 var(--b3),0 10px 20px -10px rgba(255,148,22,.9),inset 0 1px 0 rgba(255,255,255,.55)}
.btn.ok{--b1:#6ff3a6;--b2:#1fbf62;--b3:#0c7036;background:linear-gradient(180deg,var(--b1),var(--b2));color:#033118;text-shadow:0 1px 0 rgba(255,255,255,.3);box-shadow:0 4px 0 var(--b3),0 10px 20px -10px rgba(31,191,98,.9),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.bad{--b1:#ff7c90;--b2:#f2394f;--b3:#97122a;color:#fff;border:0}
.btn.sm{padding:8px 12px 9px;font-size:11.5px;border-radius:11px;box-shadow:0 3px 0 var(--b3),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.sm:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--b3)}
.btn:disabled{filter:grayscale(.85) brightness(.7);opacity:.8}
/* карточки */
.card{background:linear-gradient(180deg,rgba(60,48,128,.5),rgba(24,19,54,.78));border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 16px 30px -22px #000}
.item{background:linear-gradient(180deg,rgba(54,44,116,.45),rgba(24,19,54,.72));border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.banner{background:rgba(139,92,255,.12);border:1px solid rgba(139,92,255,.32);color:#d4ccff;border-radius:14px;padding:11px 13px;font-size:12.5px;line-height:1.45}
.bar{height:10px;border-radius:6px;background:rgba(0,0,0,.45);box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.bar>i{background:linear-gradient(90deg,#8b5cff,#ff4f8b);border-radius:6px;box-shadow:0 0 10px rgba(255,79,139,.45)}
.bar.gold>i{background:linear-gradient(90deg,#ffcf3f,#ff9416);box-shadow:0 0 10px rgba(255,180,40,.45)}
.tag{font-family:var(--display);font-weight:700;font-size:9.5px;border-radius:7px;padding:4px 8px;background:rgba(255,255,255,.1);color:var(--mute)}
.tag.taxi{background:linear-gradient(180deg,#ffd65a,#ff9416);color:#3a1c00}
.rb{font-family:var(--display);font-weight:800;font-size:9px;letter-spacing:.04em;border-radius:7px;padding:4px 8px;box-shadow:0 2px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.dot{background:linear-gradient(180deg,#ff6b81,#e8243f);box-shadow:0 2px 0 #8e0f22;font-family:var(--display);font-size:10px;color:#fff}
select,input{background:rgba(8,6,20,.6);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-weight:700}
.seg{background:rgba(8,6,20,.6);border:1px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{font-family:var(--display);font-weight:700;font-size:11.5px;padding:10px 8px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--mute);transition:background .15s}
.seg button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,#9672ff,#6a3ff0);color:#fff;box-shadow:0 3px 0 #3f1fa8,inset 0 1px 0 rgba(255,255,255,.3)}
.seg .dot{min-width:17px;height:17px;font-size:9px}
.seg.scroll{overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:4px 16px;border-radius:0;border-width:1px 0;background:rgba(8,6,20,.45)}
.seg.scroll::-webkit-scrollbar{display:none}
.seg.scroll button{flex:none;padding:10px 14px}
.fastt{font-family:var(--display);font-weight:700;font-size:11px;padding:7px 10px 7px 8px;background:rgba(8,6,20,.6);flex:none}
.fastt[aria-pressed="true"]{background:linear-gradient(180deg,#ffd65a,#ff9416);color:#3a1c00}
/* нижнее меню */
nav.tabs{background:linear-gradient(180deg,rgba(28,22,62,.94),rgba(13,10,30,.98));border-top:1px solid var(--line);padding:7px 6px calc(9px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0;box-shadow:0 -12px 30px rgba(0,0,0,.5)}
nav.tabs button{position:relative;gap:3px;font-family:var(--display);font-weight:600;font-size:9.5px;color:var(--mute);padding:0}
nav.tabs button::before{display:none!important}
nav.tabs .ni{width:46px;height:34px;border-radius:12px;display:grid;place-content:center;transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .2s}
nav.tabs .ni svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="true"]{color:#fff}
nav.tabs button[aria-current="true"] .ni{background:linear-gradient(180deg,#ffd65a,#ff9416);box-shadow:0 3px 0 #b45700,0 8px 18px -6px rgba(255,148,22,.8);transform:translateY(-7px);color:#3a1c00}
nav.tabs button[aria-current="true"] svg{animation:navpop .45s cubic-bezier(.3,1.8,.5,1);filter:none;stroke-width:2.3}
.ndot{position:absolute;top:0;right:calc(50% - 24px);width:10px;height:10px;border-radius:50%;background:#ff4d6a;border:2px solid #120e28}
/* меню «три полоски» */
.drawer{width:min(92vw,380px);background:linear-gradient(180deg,#221b4a,#110d26);padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(20px + env(safe-area-inset-bottom,0px));gap:8px;border-radius:0 24px 24px 0;border-right:1px solid var(--line)}
.mhead{display:flex;align-items:center;gap:12px;padding:4px 2px 8px}
.mwho{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mwho b{font-family:var(--display);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mwho span{color:var(--mute);font-size:12px}
.drawer .mx{width:38px;height:38px;padding:0;justify-content:center;border-radius:12px;background:rgba(255,255,255,.08);font-weight:800}
.mset{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mset .uisw{grid-column:1/-1}
.drawer .swt{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-family:var(--display);font-weight:700;font-size:11.5px}
.drawer .swt svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.drawer .swt span{flex:1;text-align:left}
.drawer .swt i{flex:none;width:36px;height:21px;border-radius:11px;background:rgba(0,0,0,.5);position:relative;transition:background .2s}
.drawer .swt i::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.drawer .swt[aria-pressed="true"] i{background:var(--ok)}
.drawer .swt[aria-pressed="true"] i::after{transform:translateX(15px)}
.drawer .grp{font-family:var(--display);font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--mute);padding:12px 4px 2px;text-transform:uppercase}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.drawer .mt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;padding:13px 4px 11px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-weight:700;font-size:11.5px;text-align:center;line-height:1.15}
.drawer .mt.on{background:rgba(255,176,46,.14);border-color:rgba(255,176,46,.55)}
.drawer .mt .dot{position:absolute;top:6px;right:6px}
/* главная */
.hero{display:flex;align-items:center;gap:14px;padding:16px;border-radius:24px;background:radial-gradient(120% 120% at 0% 0%,rgba(139,92,255,.5),transparent 60%),radial-gradient(100% 100% at 100% 100%,rgba(255,79,139,.35),transparent 60%),linear-gradient(180deg,rgba(44,34,98,.8),rgba(20,16,46,.85));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.hinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.hinfo h1{font-size:20px;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0}
.chip{font-family:var(--display);font-size:10px;font-weight:700;padding:4px 9px;border-radius:8px;background:rgba(255,207,63,.16);color:var(--gold);border:1px solid rgba(255,207,63,.38)}
.xpbar{width:100%;height:8px;border-radius:5px;background:rgba(0,0,0,.45);overflow:hidden}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ffcf3f,#ff9416);border-radius:5px}
.taxiw{gap:12px}
.taxiw .tw1{display:flex;align-items:center;gap:12px}
.taxiw .tw1 .grow{flex:1;display:flex;flex-direction:column;min-width:0}
.taxiw .tw1 b{font-family:var(--display);font-size:15px}
.taxiw .tw2{display:flex;align-items:center;justify-content:space-between;gap:10px}
.taxiw .tw2 b{font-family:var(--display);font-size:24px;color:var(--gold);text-shadow:0 0 18px rgba(255,207,63,.35)}
.ih{display:flex;align-items:center;gap:10px}
.feat{position:relative;overflow:hidden;display:grid;grid-template-columns:1fr;gap:5px;padding:16px;border-radius:24px;text-align:left;min-height:156px;background:linear-gradient(135deg,color-mix(in srgb,var(--c1),#1a1240 25%),#24185a 70%);border:1px solid rgba(255,255,255,.16);box-shadow:0 5px 0 #0d0a22,0 18px 40px -22px var(--c1),inset 0 1px 0 rgba(255,255,255,.25);isolation:isolate;transition:transform .08s}
.feat:active{transform:translateY(3px)}
.feat .rays{inset:-70% -40% -70% 20%;opacity:.3;z-index:-1}
.fchip{display:inline-flex;align-items:center;gap:5px;justify-self:start;font-family:var(--display);font-weight:800;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;padding:5px 9px;border-radius:9px;background:linear-gradient(90deg,#ff4b4b,#ff9f1c);color:#fff;box-shadow:0 3px 0 #8c2410}
.fchip svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.fname{font-family:var(--display);font-size:21px;font-weight:800;max-width:58%;line-height:1.1;margin-top:6px}
.fsub{font-size:12px;color:rgba(255,255,255,.75);max-width:52%}
.fbtn{justify-self:start;margin-top:8px}
.fcar{position:absolute;right:-14px;bottom:10px;width:60%;filter:drop-shadow(0 14px 12px rgba(0,0,0,.55));animation:bob 3s ease-in-out infinite;z-index:-1}
.qgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qt{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:13px 2px 11px;border-radius:18px;background:linear-gradient(180deg,rgba(54,44,116,.5),rgba(24,19,54,.75));border:1px solid var(--line);font-weight:700;font-size:11px;box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s}
.qt:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.qt .dot{position:absolute;top:6px;right:8px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 -6px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats>div{display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 4px;border-radius:16px;background:rgba(8,6,20,.55);border:1px solid var(--line)}
.stats b{font-family:var(--display);font-size:15px}
.stats span{font-size:11px;color:var(--mute)}
/* кейсы */
.cbox{border-radius:22px;padding:0 10px 12px;gap:7px;background:linear-gradient(180deg,color-mix(in srgb,var(--c1),#0d0a20 25%) 0%,color-mix(in srgb,var(--c1),#0d0a20 72%) 52%,#140f2c 100%);border:1px solid color-mix(in srgb,var(--c1),#fff 25%);box-shadow:0 5px 0 color-mix(in srgb,var(--c1),#000 68%),0 18px 30px -18px var(--c1),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .08s,box-shadow .08s}
.cbox:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--c1),#000 68%),inset 0 1px 0 rgba(255,255,255,.35)}
.cbox .cname{font-size:13.5px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.cbox .cprice{font-family:var(--display);font-weight:800;font-size:12.5px;padding:7px 14px;border-radius:12px;background:linear-gradient(180deg,#ffd65a,#ff9416);color:#3a1c00;box-shadow:0 3px 0 #b45700}
.ctag,.cfree{font-family:var(--display);border-radius:8px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.grp-h h3{font-size:15px}
.fcase{border-color:rgba(127,255,180,.5)}
.fcase .cprice{background:rgba(8,6,20,.7);color:#bfffd9;box-shadow:none}
.fcase.ready .cprice{background:linear-gradient(180deg,#6ff3a6,#1fbf62);color:#033118;box-shadow:0 3px 0 #0c7036}
.fcase .cname{font-size:17px}
.pity{height:5px;border-radius:3px}
.case{background:linear-gradient(110deg,color-mix(in srgb,var(--cc,#8b5cff),#140f2e 62%),rgba(22,17,50,.85));border-radius:20px;border:1px solid color-mix(in srgb,var(--cc,#8b5cff),transparent 55%);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.case .box{background:linear-gradient(160deg,color-mix(in srgb,var(--cc),#fff 25%),var(--cc) 50%,color-mix(in srgb,var(--cc),#000 35%));box-shadow:0 4px 0 color-mix(in srgb,var(--cc),#000 60%),inset 0 1px 0 rgba(255,255,255,.4)}
.case .box b{font-family:var(--display);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);font-size:26px}
.case .box::after{display:none}
.case h3{font-size:14px}
/* гараж */
.tile{border-radius:18px;padding:8px 10px 12px;background:radial-gradient(120% 70% at 50% 25%,color-mix(in srgb,var(--rc) 38%,transparent),transparent 70%),linear-gradient(180deg,rgba(54,44,116,.45),rgba(20,16,46,.82));border:1px solid color-mix(in srgb,var(--rc) 40%,transparent);box-shadow:0 4px 0 rgba(0,0,0,.4)}
.tile::before{height:4px;border-radius:0 0 4px 4px;left:22%;right:22%;box-shadow:0 0 12px var(--rc)}
.tile .nm{font-family:var(--display);font-weight:700;font-size:11.5px;min-height:2.5em}
.tile .vl{font-family:var(--display);color:var(--gold);font-size:12px}
.selbar{background:linear-gradient(180deg,#2b2262,#191338);border-color:var(--gold)}
/* окна */
.modal{background:rgba(6,4,16,.75)}
.sheet{background:linear-gradient(180deg,#241c50,#130f2c 45%);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding-top:24px;position:relative}
.sheet::before{content:"";position:absolute;top:9px;left:50%;width:42px;height:4px;margin-left:-21px;border-radius:2px;background:rgba(255,255,255,.22)}
.sheet .x{background:rgba(40,32,84,.92);border:1px solid var(--line);border-radius:12px;width:34px;height:34px;position:sticky;top:0;z-index:8;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.toast{background:linear-gradient(180deg,#2e2566,#1a143c);color:#fff;border:1px solid rgba(255,207,63,.5);border-radius:16px;font-family:var(--display);font-weight:700;font-size:12.5px;padding:12px 16px;box-shadow:0 14px 30px -8px rgba(0,0,0,.75),0 0 0 4px rgba(255,207,63,.08)}
.roul{border-radius:16px;border:1px solid var(--line)}
.ri{border-radius:12px}
.rank{background:linear-gradient(180deg,rgba(54,44,116,.45),rgba(24,19,54,.72));border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.rank:nth-child(1) .p{color:#ffcf3f}.rank:nth-child(2) .p{color:#d9e1ea}.rank:nth-child(3) .p{color:#e09b5b}
.rank.me{outline:2px solid var(--gold);outline-offset:-1px}
.bp .lv{background:linear-gradient(180deg,#3a2f78,#231c4d);border-radius:12px;box-shadow:0 3px 0 #120e28}
.bp .rw{background:linear-gradient(180deg,rgba(54,44,116,.5),rgba(24,19,54,.75));border:1px solid var(--line);border-radius:12px}
.bp .rw.prem{background:linear-gradient(160deg,rgba(255,176,46,.28),rgba(24,19,54,.8) 65%);border-color:rgba(255,176,46,.35)}
.coll .c{background:rgba(8,6,20,.5);border:1px solid var(--line);border-radius:12px}
.contents .ci{background:rgba(8,6,20,.5)}
.washer{border-radius:22px}
/* магазин */
.balcard{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:18px 16px;border-radius:24px;background:radial-gradient(100% 120% at 50% 0%,rgba(255,207,63,.35),transparent 60%),linear-gradient(180deg,rgba(60,44,124,.65),rgba(22,17,50,.9));border:1px solid rgba(255,207,63,.38)}
.bigbal{display:flex;align-items:center;gap:8px}
.bigbal .cur{width:42px;height:42px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
.bigbal b{font-family:var(--display);font-size:34px;font-weight:900;color:var(--gold);text-shadow:0 0 24px rgba(255,207,63,.4)}
.packs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px;padding-top:6px}
@media(min-width:520px){.packs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pack{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 10px 12px;border-radius:20px;background:radial-gradient(90% 60% at 50% 30%,rgba(255,207,63,.22),transparent 70%),linear-gradient(180deg,rgba(58,46,122,.65),rgba(22,17,50,.9));border:1px solid var(--line);box-shadow:0 4px 0 #0c0920;transition:transform .08s,box-shadow .08s}
.pack:active{transform:translateY(3px);box-shadow:0 1px 0 #0c0920}
.pack.hot{border-color:rgba(255,207,63,.65);box-shadow:0 4px 0 #0c0920,0 0 26px -6px rgba(255,207,63,.65)}
.ptag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--display);font-weight:800;font-size:9px;padding:4px 9px;border-radius:8px;background:linear-gradient(90deg,#ff4b4b,#ff9f1c);color:#fff;box-shadow:0 2px 0 #8c2410}
.pile{width:100%;max-width:118px;aspect-ratio:100/92;filter:drop-shadow(0 8px 8px rgba(0,0,0,.45))}
.pamt{font-family:var(--display);font-weight:900;font-size:22px;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.pbonus{font-size:11px;font-weight:800;color:#7dffb0}
.pbonus.muted{color:var(--mute);font-weight:600}
.pprice{display:flex;align-items:center;gap:4px;margin-top:5px;font-family:var(--display);font-weight:700;font-size:11.5px;padding:7px 12px;border-radius:12px;background:linear-gradient(180deg,#a98bff,#7a4dff);box-shadow:0 3px 0 #4b23b8;color:#fff}
.pprice .cur{width:16px;height:16px}
.deal{position:relative;overflow:hidden;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:16px;border-radius:22px;background:linear-gradient(135deg,#ff4b4b,#8b2ff0);box-shadow:0 5px 0 #4a1170,0 18px 40px -20px #ff4b4b,inset 0 1px 0 rgba(255,255,255,.35);color:#fff}
.deal .dl{display:flex;flex-direction:column;gap:5px;min-width:0}
.deal small{display:flex;align-items:center;gap:4px;font-family:var(--display);font-weight:700;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;opacity:.95}
.deal small svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2.4}
.deal b{font-family:var(--display);font-size:19px;line-height:1.15}
.old{text-decoration:line-through;opacity:.65;font-weight:700;margin-right:6px;font-size:12px}
.disc{font-family:var(--display);font-weight:800;font-size:10.5px;padding:3px 7px;border-radius:7px;background:#ff3354;color:#fff;box-shadow:0 2px 0 #8c0f23}
.offer{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:14px;border-radius:20px;background:linear-gradient(180deg,rgba(58,46,122,.55),rgba(22,17,50,.88));border:1px solid var(--line);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.offer .ot{display:flex;flex-direction:column;gap:6px;min-width:0}
.offer .ot b{font-family:var(--display);font-size:14px}
.offer .chips{display:flex;flex-wrap:wrap;gap:4px}
.offer .chips span{font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:7px;background:rgba(255,255,255,.08)}
.offer .buy{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px}
.show{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 14px;border-radius:24px;text-align:center;background:radial-gradient(90% 70% at 50% 40%,color-mix(in srgb,var(--c1,#ffcf3f) 40%,transparent),transparent 70%),linear-gradient(180deg,#2c2160,#140f2e);border:1px solid color-mix(in srgb,var(--c1,#ffcf3f) 55%,transparent);isolation:isolate}
.show .rays{--c1:#ffcf3f;inset:-40%;z-index:-1;opacity:.25}
.show .art{max-width:320px;filter:drop-shadow(0 14px 14px rgba(0,0,0,.6))}
.show>b{font-family:var(--display);font-size:20px}
.tplate{font-family:var(--display);font-weight:800;font-size:11.5px;padding:7px 12px;border-radius:10px;background:linear-gradient(90deg,#ffd65a,#ff9416);color:#3a1c00;box-shadow:0 3px 0 #9c5a00}
.cur{display:inline-block;vertical-align:middle}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:28px 16px;border-radius:20px;border:1px dashed var(--line);color:var(--mute);font-size:13px}
.empty svg{width:36px;height:36px;stroke:var(--mute);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.empty b{color:var(--fg);font-family:var(--display);font-size:14px}
.tmr{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;color:#ff9a6b}
.tmr svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2}
.item.ret{flex-wrap:nowrap}
.item.ret .grow{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
#view.v-in .qgrid>*,#view.v-in .packs>*,#view.v-in .stats>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 45ms + .1s)}
.fcase.ready .cprice{animation:readyglow 1.6s ease-in-out infinite}
.cfree{animation:readyglow 1.6s ease-in-out infinite;background:linear-gradient(180deg,#6ff3a6,#1fbf62);color:#033118}
@keyframes readyglow{50%{transform:scale(1.07)}}
.live{animation:livepulse 1.4s ease-in-out infinite}
@keyframes livepulse{50%{transform:scale(1.1)}}
/* ===== v5: гонки, шоурум, ивенты, уровни, обучение, профили ===== */
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
.schips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.schips span{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:5px 9px;border-radius:9px;background:rgba(8,6,20,.6);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.schips svg{width:13px;height:13px;stroke:var(--gold);fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.schips .cur{width:15px;height:15px}
/* шоурум */
.shw{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 14px 16px;border-radius:24px;background:radial-gradient(70% 55% at 50% 42%,color-mix(in srgb,var(--rc,#8b5cff) 34%,transparent),transparent 70%),linear-gradient(180deg,#1c1640,#0e0b22);border:1px solid var(--line);isolation:isolate}
.shw .spot{position:absolute;left:50%;top:-30%;width:70%;height:110%;transform:translateX(-50%);background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 75%);clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);z-index:-1;pointer-events:none}
.stage-t{align-self:stretch;display:flex;justify-content:space-between;font-family:var(--display);font-size:11px;font-weight:700;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
.scar{width:min(320px,86%);position:relative;z-index:1;filter:drop-shadow(0 16px 14px rgba(0,0,0,.6))}
.scar.ghost{filter:brightness(0) opacity(.35)}
.scar.inr{animation:shin .45s cubic-bezier(.2,.9,.3,1)}
.scar.inl{animation:shinl .45s cubic-bezier(.2,.9,.3,1)}
@keyframes shin{from{transform:translateX(60px);opacity:0}}
@keyframes shinl{from{transform:translateX(-60px);opacity:0}}
.podium{width:min(300px,80%);height:16px;margin-top:-22px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--rc,#8b5cff) 80%,#fff 10%),transparent);opacity:.75;filter:blur(1px)}
.sinfo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.sinfo b{font-family:var(--display);font-size:16px}
.sarr{position:absolute;top:46%;z-index:2;width:36px;height:36px;border-radius:12px;background:rgba(8,6,20,.6);border:1px solid var(--line);font-size:22px;font-weight:800;line-height:1;display:grid;place-content:center}
.sarr.l{left:8px}.sarr.r{right:8px}
.sarr:active{transform:scale(.9)}
/* ивент */
.evb{position:relative;overflow:hidden;display:grid;gap:5px;padding:16px;border-radius:24px;text-align:left;min-height:170px;background:linear-gradient(135deg,var(--c1),var(--c2));border:1px solid rgba(255,255,255,.2);box-shadow:0 5px 0 color-mix(in srgb,var(--c2),#000 50%),0 18px 40px -20px var(--c1),inset 0 1px 0 rgba(255,255,255,.3);isolation:isolate;transition:transform .08s}
.evb:active{transform:translateY(3px)}
.evb .rays{--c1:#fff;inset:-60% -40% -60% 30%;opacity:.14;z-index:-1}
.evn{font-family:var(--display);font-size:22px;font-weight:900;max-width:62%;line-height:1.1;margin-top:4px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.evs{font-size:12px;color:rgba(255,255,255,.85);max-width:56%}
.evcars{position:absolute;right:-18px;bottom:6px;width:58%;height:70%;z-index:-1}
.evc{position:absolute;width:100%;filter:drop-shadow(0 10px 10px rgba(0,0,0,.5))}
.evc.e0{bottom:30%;right:12%;width:86%;opacity:.85}
.evc.e1{bottom:0;right:0;animation:bob 3s ease-in-out infinite}
.evtag{display:block;font-style:normal;font-size:8.5px;font-weight:800;color:#ff8ad0;text-transform:uppercase;letter-spacing:.05em}
.evg{border-color:color-mix(in srgb,var(--c1),transparent 40%)}
.evg b{font-family:var(--display);font-size:13px}
/* замки */
.cbox.locked .cstage,.cbox.locked .cprice,.cbox.locked .chances{filter:grayscale(1) brightness(.55)}
.lockov{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(8,6,20,.35);font-family:var(--display);font-weight:800;font-size:12px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.lockov svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))}
.cgrid.one{grid-template-columns:minmax(0,200px);justify-content:center}
/* окно уровня и приветствие */
.lvup,.welcome,.rres{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:6px 0;isolation:isolate}
.lvup .rays,.welcome .rays,.rres .rays{--c1:#ffcf3f;inset:auto;left:50%;top:22%;width:560px;height:560px;margin:-280px 0 0 -280px;opacity:.28;z-index:-1}
.lvup .ava.xl{width:96px;height:96px;animation:popin .7s cubic-bezier(.2,1.6,.4,1) both}
.lvup .ava.xl b{font-size:40px;background:linear-gradient(160deg,#ffe07a,#ff9416);color:#3a1c00;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.lvup h2{font-size:26px}
.welcome .wcar{width:min(300px,88%);animation:popin .8s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 14px 14px rgba(0,0,0,.6))}
.welcome h2{font-size:21px}
.welcome p{margin:0;max-width:34ch;line-height:1.45}
/* обучение */
#coachRoot .coach{position:fixed;inset:0;z-index:85;pointer-events:none}
.cring{position:fixed;border-radius:18px;box-shadow:0 0 0 9999px rgba(6,4,16,.66),0 0 0 3px var(--gold),0 0 30px 6px rgba(255,207,63,.6);animation:cring 1.4s ease-in-out infinite;pointer-events:none}
@keyframes cring{50%{box-shadow:0 0 0 9999px rgba(6,4,16,.66),0 0 0 5px var(--gold),0 0 40px 10px rgba(255,207,63,.85)}}
.cbub{position:fixed;left:16px;right:16px;max-width:420px;margin:0 auto;pointer-events:auto;display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:18px;background:linear-gradient(180deg,#2e2566,#1a143c);border:1px solid rgba(255,207,63,.55);font-weight:700;font-size:14px;line-height:1.45;box-shadow:0 14px 30px rgba(0,0,0,.6);animation:rise .35s both}
/* профиль */
.prof{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.prof .pn{font-family:var(--display);font-size:20px}
.prof .stats{align-self:stretch}
.pbest{position:relative;overflow:hidden;align-self:stretch;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;border-radius:20px;background:radial-gradient(70% 60% at 50% 45%,color-mix(in srgb,var(--rc) 35%,transparent),transparent 70%),rgba(8,6,20,.5);border:1px solid var(--line);isolation:isolate}
.pbest .spot{position:absolute;left:50%;top:-20%;width:60%;height:100%;transform:translateX(-50%);background:linear-gradient(180deg,rgba(255,255,255,.14),transparent 75%);clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);z-index:-1}
.pbest .art{max-width:280px}
.pbest>b{font-family:var(--display);font-size:15px}
.pgar{align-self:stretch;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pg{display:flex;flex-direction:column;gap:2px;padding:6px 4px;border-radius:12px;background:rgba(8,6,20,.5);border-bottom:2px solid var(--rc);font-size:9.5px;font-weight:700;line-height:1.15}
button.rank{width:100%;text-align:left;font:inherit;color:inherit}
button.rank:active{transform:scale(.98)}
/* экран гонок */
.rcard{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:9px;padding:14px;border-radius:24px;background:radial-gradient(70% 55% at 50% 38%,color-mix(in srgb,var(--rc) 32%,transparent),transparent 70%),linear-gradient(180deg,#1c1640,#0e0b22);border:1px solid var(--line);isolation:isolate}
.rcard .spot{position:absolute;left:50%;top:-30%;width:70%;height:100%;transform:translateX(-50%);background:linear-gradient(180deg,rgba(255,255,255,.16),transparent 75%);clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);z-index:-1}
.rc-car{width:min(320px,88%);filter:drop-shadow(0 14px 12px rgba(0,0,0,.6))}
.rmeta{align-self:stretch;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.rmeta span{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;background:rgba(8,6,20,.55);font-size:10.5px;color:var(--mute)}
.rmeta b{font-family:var(--display);font-size:14px;color:var(--fg)}
.rcard select{align-self:stretch}
.rmode{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:linear-gradient(180deg,rgba(58,46,122,.55),rgba(22,17,50,.88));border:1px solid var(--line);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.rmode .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rmode .grow b{font-family:var(--display);font-size:14px}
.rmode.locked{opacity:.7}
/* перед гонкой */
.pre{display:flex;flex-direction:column;gap:12px}
.prow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.pc{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0;padding:8px 4px;border-radius:16px;background:radial-gradient(80% 60% at 50% 35%,color-mix(in srgb,var(--rc) 35%,transparent),transparent 70%),rgba(8,6,20,.5)}
.pc b{font-family:var(--display);font-size:11.5px;line-height:1.2}
.pc span{font-size:11px;color:var(--mute)}
.prow .v{font-family:var(--display);font-size:24px;color:var(--gold);text-shadow:0 0 16px rgba(255,207,63,.6)}
.cmp{display:flex;flex-direction:column;gap:4px}
.cmp small{text-align:center;font-size:11px;color:var(--mute);font-weight:700}
.crow{display:grid;grid-template-columns:auto 1fr 1fr auto;align-items:center;gap:6px}
.crow b{font-family:var(--display);font-size:12px;font-weight:700;color:var(--mute);min-width:62px}
.crow b:last-child{text-align:right}
.crow b.w{color:#7dffb0}
.cb{height:10px;border-radius:5px;background:rgba(0,0,0,.45);overflow:hidden;display:flex;justify-content:flex-end}
.cb i{display:block;height:100%;border-radius:5px;background:linear-gradient(270deg,#ffcf3f,#ff9416)}
.cb.r{justify-content:flex-start}.cb.r i{background:linear-gradient(90deg,#ff4f8b,#8b5cff)}
/* гонка */
.race{display:flex;flex-direction:column;gap:10px;user-select:none;-webkit-user-select:none}
.rtop{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.rp{display:flex;flex-direction:column;min-width:0}.rp.op{text-align:right}
.rp b{font-family:var(--display);font-size:13px}.rp span{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rclock{display:flex;flex-direction:column;align-items:center}.rclock span{font-family:var(--display);font-size:26px;font-weight:800}.rclock small{font-size:10px;color:var(--mute)}
.rprog{display:flex;flex-direction:column;gap:3px}.rprog>div{height:6px;border-radius:3px;background:rgba(0,0,0,.5);overflow:hidden}.rprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffcf3f,#ff9416)}.rprog .o i{background:linear-gradient(90deg,#ff4f8b,#8b5cff)}
.track{position:relative;height:200px;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#120d30 0,#3b1d5c 26%,#ff7a59 31%,#17151f 31%,#1f1d29 100%);border:1px solid var(--line)}
.track .sky{position:absolute;left:0;right:0;top:0;height:31%;background:radial-gradient(40% 80% at 70% 100%,rgba(255,180,90,.6),transparent 70%)}
.stripes{position:absolute;left:0;right:0;top:31%;bottom:0;background:linear-gradient(90deg,#eee 50%,#d22 50%) 0 0/28px 5px repeat-x,linear-gradient(90deg,rgba(255,255,255,.75) 50%,transparent 50%) 0 52%/56px 3px repeat-x,linear-gradient(90deg,#eee 50%,#d22 50%) 0 100%/28px 5px repeat-x}
.track.fast .stripes{filter:blur(.6px)}
.fin{position:absolute;top:31%;bottom:0;left:0;width:12px;background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/12px 12px;opacity:.95}
.rcar{position:absolute;left:0;width:36%;will-change:transform}
.rcar.op{bottom:47%;width:31%;filter:brightness(.8) saturate(.9);z-index:1}
.rcar.me{bottom:5%;z-index:2}
.lights{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:7px 10px;border-radius:14px;background:rgba(6,4,16,.8);border:1px solid var(--line);z-index:3;transition:opacity .4s}
.lights.off{opacity:0}
.lights i{width:18px;height:18px;border-radius:50%;background:#2a2a35;box-shadow:inset 0 2px 3px rgba(0,0,0,.6)}
.lights i.r{background:#ff3b3b;box-shadow:0 0 14px 3px rgba(255,59,59,.8)}
.lights i.g{background:#2fd27a;box-shadow:0 0 16px 4px rgba(47,210,122,.85)}
.rmsg{position:absolute;left:0;right:0;top:36%;text-align:center;font-family:var(--display);font-weight:900;font-size:22px;opacity:0;z-index:4;text-shadow:0 3px 0 rgba(0,0,0,.5);pointer-events:none}
.rmsg.show{animation:rmsg 1s ease-out both}
.rmsg.ok{color:#7dffb0}.rmsg.bad{color:#ff7a8a}
@keyframes rmsg{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.1)}70%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-14px)}}
.dash{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.gbox{display:flex;flex-direction:column;align-items:center}
.gbox b{font-family:var(--display);font-size:34px;font-weight:900;line-height:1}
.gbox small{font-size:10px;color:var(--mute)}
.tacho{position:relative;width:150px;height:96px}
.tacho svg{width:100%;height:100%}
.ndl{position:absolute;left:50%;bottom:30px;width:4px;height:50px;margin-left:-2px;border-radius:2px;background:linear-gradient(#fff,#ff3b5c);transform-origin:50% 100%;transform:rotate(-120deg);box-shadow:0 0 8px rgba(255,59,92,.7)}
.rbtn{font-size:19px;padding:20px 16px 21px;border-radius:18px;--b1:#4c4588;--b2:#342d68;--b3:#1c1742;touch-action:manipulation}
.rbtn.go{--b1:#6ff3a6;--b2:#1fbf62;--b3:#0c7036;background:linear-gradient(180deg,var(--b1),var(--b2));color:#033118;text-shadow:0 1px 0 rgba(255,255,255,.3)}
.rres .glow{font-size:30px}
.rres.win .glow{color:var(--gold)}
.rres.lose .glow{color:#ff7a8a}
.rres.lose .rays{--c1:#ff4d6a;opacity:.15}
.rtimes{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-self:stretch}
.rtimes>div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px;border-radius:14px;background:rgba(8,6,20,.55);border:1px solid var(--line)}
.rtimes span{font-size:11px;color:var(--mute)}
.rtimes b{font-family:var(--display);font-size:18px}
.rrw{font-family:var(--display);font-size:18px;color:var(--gold)}
.rres.lose .rrw{color:#ff9aa8}
.mset{grid-template-columns:repeat(3,minmax(0,1fr))}
.drawer .swt{flex-direction:column;align-items:center;gap:7px;padding:11px 6px}
.drawer .swt span{text-align:center}
.pc .rb,.prof .rb{color:#0b0d12}
.float,.fcar,.box,.evc.e1,.rays,.glowb,.gift,.tile.drive .art,.rcar{will-change:transform}
#bgv{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(9,11,22,.25),rgba(9,11,22,.55) 40%,rgba(9,11,22,.35))}
.fcase.ready .cprice,.cfree{box-shadow:0 3px 0 #0c7036,0 0 16px 1px rgba(47,210,122,.6);will-change:transform}
.live{box-shadow:0 0 10px 1px rgba(229,72,77,.6);will-change:transform}
.lead{animation:none;box-shadow:0 0 0 1px var(--amber),0 0 18px -4px var(--amber)}
body.mopen #view *,body.mopen #tabs *,body.mopen header *{animation-play-state:paused!important}
.upcar{display:flex;flex-direction:column;align-items:center;gap:6px;margin:4px auto 0;width:100%;max-width:300px}
.upcar>div:last-child{display:flex;gap:6px;align-items:center}
.upval{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05)}
.upval>div{display:flex;flex-direction:column;gap:2px}.upval b.num{font-size:17px}.upval .arr{font-size:20px;opacity:.6}
.upx button{display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1}.upx button b{font-size:17px}.upx button small{font-size:11px;opacity:.75}
.aubids .btn{flex:1;min-width:0;padding-left:4px;padding-right:4px;font-size:12px}
.boot{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.boot .spin{width:42px;height:42px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:#ffb53d;animation:spin .8s linear infinite}
.dwait{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:6px 0 4px}
.dwait .spin{width:38px;height:38px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:#ff5a6e;animation:spin .8s linear infinite}
.dwait .av.q{background:rgba(255,255,255,.08);animation:pulse 1.4s ease-in-out infinite}
.feedempty{padding:10px 4px;white-space:nowrap}
.paycard{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,rgba(47,210,122,.18),rgba(47,210,122,.04));border:1px solid rgba(47,210,122,.35)}
.paycard b{color:#5ef0a0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* ===== v6: сезоны и батл пасс ===== */
.btn.gold{--b1:#ffe27a;--b2:#ffb21a;--b3:#a85a00;background:linear-gradient(180deg,var(--b1),var(--b2));color:#3a1c00;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.btn.wide{width:100%}
.shine{position:relative;overflow:hidden;isolation:isolate}
.shine::after{content:"";position:absolute;top:-20%;bottom:-20%;left:0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-160%) skewX(-18deg);animation:shine 2.8s ease-in-out infinite;z-index:1;pointer-events:none}
@keyframes shine{0%,55%{transform:translateX(-160%) skewX(-18deg)}100%{transform:translateX(330%) skewX(-18deg)}}
body.mopen .shine::after{animation-play-state:paused}
.bphead{position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;gap:14px;padding:18px 16px 16px;border-radius:26px;background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--c1) 70%,transparent),transparent 60%),linear-gradient(160deg,color-mix(in srgb,var(--c2),#000 10%),#120c26);border:1px solid color-mix(in srgb,var(--c1) 55%,transparent);box-shadow:0 5px 0 #0b0818,0 22px 40px -24px var(--c1),inset 0 1px 0 rgba(255,255,255,.2)}
.bphead .rays{inset:-60% -60% 10% 30%;z-index:-1;opacity:.22}
.bpt{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.bpt h2{font-size:28px;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.bpt .small{color:rgba(255,255,255,.8)}
.bplvl{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:rgba(6,4,16,.45);border:1px solid rgba(255,255,255,.1)}
.bplvl .grow{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.bplvl .small{color:rgba(255,255,255,.7)}
.ring{--p:0%;flex:none;width:54px;height:54px;border-radius:50%;padding:5px;background:conic-gradient(var(--gold) var(--p),rgba(255,255,255,.12) 0);display:grid}
.ring b{display:grid;place-content:center;border-radius:50%;background:linear-gradient(160deg,#ffe07a,#ff9416);color:#3a1c00;font-family:var(--display);font-size:19px;font-weight:900}
.bpbtn{gap:8px;flex-wrap:wrap}
.bpbtn .btn.wide{flex:1 1 60%}
.bpsell{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:linear-gradient(110deg,rgba(255,178,26,.22),rgba(24,19,54,.8) 70%);border:1px solid rgba(255,178,26,.45)}
.bpsell>svg{width:28px;height:28px;stroke:var(--gold);fill:none;stroke-width:2;flex:none}
.bpsell .grow{display:flex;flex-direction:column;gap:3px}
.bprow{display:grid;grid-template-columns:1fr 44px 1fr;gap:8px;align-items:stretch}
.bprow.hd{align-items:end;font-family:var(--display);font-size:11px;color:var(--mute);margin-bottom:-6px}
.bprow.hd .pc{color:var(--gold);text-align:right}
.bplist{display:flex;flex-direction:column;gap:8px}
.bplv{display:grid;place-content:center;position:relative}
.bplv::before{content:"";position:absolute;left:50%;top:-8px;bottom:-8px;width:4px;margin-left:-2px;background:rgba(255,255,255,.08)}
.bprow.on .bplv::before{background:linear-gradient(var(--gold),#ff9416)}
.bplv b{position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-content:center;font-family:var(--display);font-size:12px;background:#231c4d;border:2px solid rgba(255,255,255,.12)}
